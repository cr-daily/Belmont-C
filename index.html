<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmont C. Royal Academy - เข้าสู่ระบบ / ลงทะเบียน</title>
    
    <!-- เชื่อมโยงไฟล์ Manifest สำหรับ PWA (ติดตั้งแอป) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A1D4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            50: '#F4F7FB',
                            100: '#E8EEF7',
                            200: '#C8D6EB',
                            300: '#9CB4DB',
                            400: '#688BC7',
                            500: '#3B64B0',
                            600: '#1D438A',
                            700: '#143069',
                            800: '#0E2452',
                            900: '#0A1D4E', // Royal Sapphire Navy
                            950: '#050F2B',
                        },
                        silver: {
                            100: '#F8FAFC',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                        }
                    },
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: radial-gradient(circle at top, #F4F7FB 0%, #E2E8F0 100%);
            color: #0A1D4E; 
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1.5px solid #C8D6EB;
            box-shadow: 0 20px 40px -15px rgba(10, 29, 78, 0.15);
        }
        .silver-border {
            border: 1px solid #CBD5E1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Container หลัก -->
    <div class="w-full max-w-md royal-card rounded-3xl p-8 relative overflow-hidden">
        
        <!-- ลวดลายตกแต่งมุมการ์ด -->
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-royal-900 via-royal-500 to-royal-900"></div>

        <!-- Header โลโก้สถาบัน -->
        <div class="text-center mb-7">
            <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-royal-900 via-silver-300 to-royal-700 shadow-xl mx-auto mb-4 transform hover:scale-105 transition duration-300">
                <img src="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png" 
                     alt="Belmont C. Crest" 
                     class="w-full h-full object-cover rounded-full bg-royal-950">
            </div>
            <h1 class="font-serif text-2xl font-extrabold text-royal-900 tracking-wider">BELMONT C.</h1>
            <p class="text-[11px] font-medium tracking-[0.2em] text-silver-500 uppercase mt-0.5">Concordia Royal Academy</p>
        </div>

        <!-- Tab Switcher (เข้าสู่ระบบ / ลงทะเบียนนักเรียน) -->
        <div class="flex bg-royal-100/80 p-1.5 rounded-2xl mb-6 border border-royal-200/60">
            <button type="button" id="btn-tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 bg-royal-900 text-white shadow-md">เข้าสู่ระบบ</button>
            <button type="button" id="btn-tab-register" onclick="switchTab('register')" class="flex-1 py-2.5 rounded-xl text-xs font-medium text-royal-800 hover:text-royal-600 transition-all duration-200">ลงทะเบียน</button>
        </div>

        <!-- ฟอร์มเข้าสู่ระบบ / สมัครสมาชิก -->
        <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
            
            <!-- ช่องกรอกชื่อ (แสดงเฉพาะตอนสมัครสมาชิก) -->
            <div id="field-name" class="hidden transition-all duration-300">
                <label class="block text-xs font-semibold text-royal-900 mb-1">พระนาม / ชื่อเรียก (Name)</label>
                <input type="text" id="input-name" class="w-full px-4 py-3 rounded-xl border border-royal-200 bg-white focus:outline-none focus:border-royal-700 text-sm shadow-sm">
            </div>

            <!-- ช่องกรอกชื่อเต็ม (แสดงเฉพาะตอนสมัครสมาชิก) -->
            <div id="field-fullname" class="hidden transition-all duration-300">
                <label class="block text-xs font-semibold text-royal-900 mb-1">พระนามเต็ม / ชื่อ-สกุล (Full Name)</label>
                <input type="text" id="input-fullname" class="w-full px-4 py-3 rounded-xl border border-royal-200 bg-white focus:outline-none focus:border-royal-700 text-sm shadow-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-royal-900 mb-1">อีเมล (Email)</label>
                <input type="email" id="input-email" required class="w-full px-4 py-3 rounded-xl border border-royal-200 bg-white focus:outline-none focus:border-royal-700 text-sm shadow-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-royal-900 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" id="input-password" required class="w-full px-4 py-3 rounded-xl border border-royal-200 bg-white focus:outline-none focus:border-royal-700 text-sm shadow-sm">
            </div>

            <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-royal-900 via-royal-800 to-royal-700 text-white py-3.5 rounded-xl font-bold shadow-lg hover:from-royal-950 hover:to-royal-800 transition-all transform active:scale-95 text-sm mt-2 border border-royal-600/30">
                เข้าสู่รั้วสถาบัน
            </button>
        </form>

        <div class="mt-6 text-center">
            <p id="auth-switch-text" class="text-xs text-silver-500">
                ยังไม่มีรายชื่อในทะเบียนสถาบัน? <span onclick="switchTab('register')" class="text-royal-800 font-bold cursor-pointer hover:underline">ลงทะเบียนที่นี่</span>
            </p>
        </div>
    </div>

    <!-- Royal Popup Modal System -->
    <div id="custom-modal" class="fixed inset-0 bg-royal-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-royal-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-royal-200">⚜️</div>
            <h3 id="modal-title" class="text-lg font-bold text-royal-900 mb-2">ประกาศจากสถาบัน</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-royal-900 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-royal-800 transition w-full shadow-md">รับทราบ</button>
        </div>
    </div>

    <!-- 🔗 นำเข้าไฟล์ Cloudinary Config ภายนอก -->
    <script src="cloudinary-config.js"></script>

    <!-- Script ควบคุมการทำงานหน้า Index และเชื่อมต่อ Supabase โดยตรง -->
    <script>
        // ตั้งค่าการเชื่อมต่อ Supabase ของโปรเจกต์ Belmont C. Royal Academy
        const SUPABASE_URL = 'https://efzmhzhirzxiysnjkbty.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_z4_JEmggyRABRF86Ao6_8A_3BwwnXA7';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentMode = 'login';

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                if (supabaseClient) {
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if (session) {
                        window.location.href = 'home.html';
                    }
                }
            } catch (err) {
                console.error("Init Error:", err);
            }
        });

        function switchTab(mode) {
            currentMode = mode;
            const btnLogin = document.getElementById('btn-tab-login');
            const btnRegister = document.getElementById('btn-tab-register');
            const fieldName = document.getElementById('field-name');
            const fieldFullname = document.getElementById('field-fullname');
            const btnSubmit = document.getElementById('btn-submit');
            const switchText = document.getElementById('auth-switch-text');

            if (mode === 'login') {
                btnLogin.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 bg-royal-900 text-white shadow-md";
                btnRegister.className = "flex-1 py-2.5 rounded-xl text-xs font-medium text-royal-800 hover:text-royal-600 transition-all duration-200";
                fieldName.classList.add('hidden');
                fieldFullname.classList.add('hidden');
                btnSubmit.innerText = "เข้าสู่รั้วสถาบัน";
                switchText.innerHTML = `ยังไม่มีรายชื่อในทะเบียนสถาบัน? <span onclick="switchTab('register')" class="text-royal-800 font-bold cursor-pointer hover:underline">ลงทะเบียนที่นี่</span>`;
            } else {
                btnRegister.className = "flex-1 py-2.5 rounded-xl text-xs font-bold transition-all duration-200 bg-royal-900 text-white shadow-md";
                btnLogin.className = "flex-1 py-2.5 rounded-xl text-xs font-medium text-royal-800 hover:text-royal-600 transition-all duration-200";
                fieldName.classList.remove('hidden');
                fieldFullname.classList.remove('hidden');
                btnSubmit.innerText = "ยืนยันการลงทะเบียน";
                switchText.innerHTML = `มีรายชื่อในระบบอยู่แล้ว? <span onclick="switchTab('login')" class="text-royal-800 font-bold cursor-pointer hover:underline">เข้าสู่ระบบที่นี่</span>`;
            }
        }

        function showModal(title, message, icon = '⚜️') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('input-email').value.trim();
            const password = document.getElementById('input-password').value.trim();

            // เงื่อนไขตรวจสอบ Admin สูงสุดของสถาบัน
            const isAdmin = (email === 'adminzelisanya@gmail.com' && password === 'adminzeli');

            try {
                if (currentMode === 'register') {
                    const name = document.getElementById('input-name').value.trim();
                    const fullname = document.getElementById('input-fullname').value.trim();

                    if (!name || !fullname) {
                        showModal("ข้อมูลไม่ครบถ้วน", "กรุณากรอกพระนาม/ชื่อเรียก และชื่อเต็มให้เรียบร้อยพะยะค่ะ", "⚠️");
                        return;
                    }

                    showModal("กำลังบันทึกทะเบียน...", "โปรดรอสักครู่ ระบบกำลังออกบัตรประจำตัวให้ท่าน", "⏳");

                    // 1. สมัครสมาชิกผ่าน Supabase Auth
                    const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                        email: email,
                        password: password
                    });

                    if (authError) {
                        showModal("ลงทะเบียนไม่สำเร็จ", authError.message, "❌");
                        return;
                    }

                    if (authData.user) {
                        const userId = authData.user.id;
                        const customId = Math.floor(10000000 + Math.random() * 90000000).toString();
                        const role = isAdmin ? 'admin' : 'user';
                        const avatar = 'https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png';

                        // 2. บันทึกข้อมูลลงตาราง profiles
                        const { error: profileError } = await supabaseClient.from('profiles').insert([{
                            id: userId,
                            custom_id: customId,
                            name: name,
                            fullname: fullname,
                            email: email,
                            role: role,
                            avatar: avatar,
                            energy: 100,
                            max_energy: 100,
                            food: 100,
                            max_food: 100
                        }]);

                        if (profileError) {
                            showModal("ข้อผิดพลาด Profile", profileError.message, "❌");
                            return;
                        }

                        // 3. สร้างบัญชีธนาคารหลักอัตโนมัติ (เริ่มต้น 0 Silver ตามกฎมาตัวเปล่าของสถาบัน)
                        const accountNumber = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                        const { error: bankError } = await supabaseClient.from('bank_accounts').insert([{
                            user_id: userId,
                            account_name: 'บัญชีหลัก',
                            account_number: accountNumber,
                            silver: 0.00
                        }]);

                        if (bankError) {
                            showModal("ข้อผิดพลาด Bank", bankError.message, "❌");
                            return;
                        }

                        showModal("ลงทะเบียนสำเร็จ!", isAdmin ? "ยินดีต้อนรับท่านผู้ดูแลสูงสุดเข้าสู่ Belmont C." : "ยินดีต้อนรับสู่ Belmont Concordia Royal Academy!", "👑");
                        setTimeout(() => {
                            window.location.href = 'home.html';
                        }, 1500);
                    }

                } else {
                    // โหมดเข้าสู่ระบบปกติ
                    showModal("กำลังตรวจสอบรายชื่อ...", "โปรดรอสักครู่...", "⏳");
                    const { data, error } = await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                    if (error) {
                        showModal("เข้าสู่ระบบไม่สำเร็จ", error.message, "❌");
                        return;
                    }

                    showModal("ยินดีต้อนรับกลับมา!", "กำลังเปิดประตูสู่ Belmont Concordia Royal Academy...", "⚜️");
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 1200);
                }
            } catch (err) {
                showModal("เกิดข้อผิดพลาดระบบ", err.message || "Unknown error occurred", "❌");
            }
        }
    </script>
</body>
</html>
