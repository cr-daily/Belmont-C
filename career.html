<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmont C. - Career</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A1D4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- นำเข้าไฟล์ตั้งค่ากลาง -->
    <script src="supabase-config.js"></script>
    <script src="cloudinary-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            50: '#F4F7FB',
                            100: '#E8EEF7',
                            200: '#C8D6EB',
                            300: '#9CB4DB',
                            400: '#688BC7',
                            500: '#3B64B0',
                            600: '#1D438A',
                            700: '#143069',
                            800: '#0E2452',
                            900: '#0A1D4E', // Royal Sapphire Navy
                            950: '#050F2B',
                        },
                        silver: {
                            100: '#F8FAFC',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                        }
                    },
                    fontFamily: { 
                        sans: ['Prompt', 'sans-serif'],
                        serif: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: radial-gradient(circle at top, #F4F7FB 0%, #E2E8F0 100%);
            color: #0A1D4E; 
            min-height: 100vh; 
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1.5px solid #C8D6EB;
            box-shadow: 0 10px 30px -10px rgba(10, 29, 78, 0.1);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <!-- Main Container -->
    <div class="w-full max-w-2xl space-y-6">
        
        <!-- Header Nav -->
        <div class="border-b border-royal-200 pb-4 space-y-1">
            <a href="home.html" class="inline-flex items-center space-x-1 text-xs font-bold text-royal-900 bg-royal-100 hover:bg-royal-200 px-4 py-2 rounded-xl transition border border-royal-200 shadow-sm mb-2">
                <span>← กลับสู่หน้าหลักสถาบัน</span>
            </a>
            <h1 class="font-serif text-xl md:text-2xl font-extrabold text-royal-900 tracking-wide whitespace-nowrap">💼 Career (ระบบการทำงาน)</h1>
        </div>

        <!-- กล่องแสดงยอดเงินในบัญชีปัจจุบัน -->
        <div class="royal-card px-5 py-3 rounded-3xl flex items-center justify-between shadow-sm">
            <div class="text-xs text-silver-500 font-medium">💰 เงินในบัญชีปัจจุบัน</div>
            <div id="user-silver-display" class="text-sm font-extrabold text-royal-900">0 Silver</div>
        </div>

        <!-- Tab Switcher -->
        <div class="grid grid-cols-2 gap-2 bg-royal-100 p-1.5 rounded-2xl text-center border border-royal-200">
            <button id="tab-main-btn" onclick="switchTab('main')" class="py-2.5 rounded-xl text-xs font-bold bg-royal-900 text-white shadow-sm transition">👔 งานหลัก (Main Job)</button>
            <button id="tab-side-btn" onclick="switchTab('side')" class="py-2.5 rounded-xl text-xs font-medium text-royal-900 hover:text-royal-600 transition">⚡ งานเสริม (Side Job)</button>
        </div>

        <!-- Section 1: งานหลัก (Main Job) -->
        <div id="view-main" class="space-y-4">
            <div id="main-job-view-container" class="space-y-4">
                <p class="text-center text-xs text-silver-500 py-10">กำลังโหลดข้อมูลงานหลัก...</p>
            </div>
        </div>

        <!-- Section 2: งานเสริม (Side Job) -->
        <div id="view-side" class="hidden space-y-4">
            <div id="active-side-job-container"></div>

            <div class="royal-card p-4 rounded-3xl space-y-1">
                <h2 class="text-sm font-bold text-royal-900 font-serif">⚡ รายการงานเสริมพาร์ทไทม์</h2>
                <p class="text-[11px] text-silver-500">เลือกทำงานเสริมเพื่อรับรายได้พิเศษ (ใช้พลังงาน อาหาร และทักษะ)</p>
            </div>

            <div id="side-jobs-container" class="space-y-3">
                <p class="text-center text-xs text-silver-500 py-6">กำลังโหลดรายการงานเสริม...</p>
            </div>
        </div>

    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="custom-modal" class="fixed inset-0 bg-royal-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-royal-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-royal-200">⚜️</div>
            <h3 id="modal-title" class="text-lg font-bold text-royal-900 mb-2 font-serif">แจ้งเตือนสถาบัน</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-royal-900 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-royal-800 transition w-full shadow-md">รับทราบ</button>
        </div>
    </div>

    <script>
        let currentUserId = null;
        let currentUserProfile = null;
        let activeBankAccount = null;
        let userSkillsMap = {};
        let careersCatalogData = [];
        let userMainJob = null;
        let activeSideJob = null;
        let timerInterval = null;

        function showModal(title, message, icon = '⚜️', cb = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            window.modalCallback = cb;
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); if(window.modalCallback) window.modalCallback(); }, 200);
        }

        function switchTab(tab) {
            const mainBtn = document.getElementById('tab-main-btn');
            const sideBtn = document.getElementById('tab-side-btn');
            const mainView = document.getElementById('view-main');
            const sideView = document.getElementById('view-side');

            if (tab === 'main') {
                mainBtn.className = "py-2.5 rounded-xl text-xs font-bold bg-royal-900 text-white shadow-sm transition";
                sideBtn.className = "py-2.5 rounded-xl text-xs font-medium text-royal-900 hover:text-royal-600 transition";
                mainView.classList.remove('hidden');
                sideView.classList.add('hidden');
            } else {
                sideBtn.className = "py-2.5 rounded-xl text-xs font-bold bg-royal-900 text-white shadow-sm transition";
                mainBtn.className = "py-2.5 rounded-xl text-xs font-medium text-royal-900 hover:text-royal-600 transition";
                sideView.classList.remove('hidden');
                mainView.classList.add('hidden');
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUserId = session.user.id;

            await loadUserData();
            await loadActiveAccount();
            await loadUserSkills();
            await loadCareersCatalog();
            await loadUserCareer();
            loadActiveSideJobFromStorage();
        });

        async function loadUserData() {
            const { data } = await supabase.from('profiles').select('*').eq('id', currentUserId).single();
            if (data) currentUserProfile = data;
        }

        async function loadActiveAccount() {
            const activeAccNo = sessionStorage.getItem('active_bank_acc');
            let query = supabase.from('bank_accounts').select('*').eq('user_id', currentUserId);
            if (activeAccNo) query = query.eq('account_number', activeAccNo);

            const { data } = await query.limit(1);
            if (data && data.length > 0) {
                activeBankAccount = data[0];
                document.getElementById('user-silver-display').innerText = Number(activeBankAccount.silver).toLocaleString() + ' Silver';
            } else {
                const { data: fallback } = await supabase.from('bank_accounts').select('*').eq('user_id', currentUserId).order('created_at', { ascending: true }).limit(1);
                if (fallback && fallback.length > 0) {
                    activeBankAccount = fallback[0];
                    document.getElementById('user-silver-display').innerText = Number(activeBankAccount.silver).toLocaleString() + ' Silver';
                }
            }
        }

        async function loadUserSkills() {
            const { data } = await supabase.from('user_skills').select('*').eq('user_id', currentUserId);
            userSkillsMap = {};
            if (data) {
                data.forEach(s => { userSkillsMap[s.skill_name] = s; });
            }
        }

        async function loadCareersCatalog() {
            const { data } = await supabase.from('careers_catalog').select('*').order('created_at', { ascending: true });
            careersCatalogData = data || [];
        }

        async function checkAndAccrueSalary(jobData) {
            if (!jobData || !jobData.careers_catalog) return jobData;

            let job = jobData.careers_catalog;
            let multiplier = getSkillBonusMultiplier(job.required_skill_name);
            let effectiveSalary = Math.round(Number(job.salary_or_reward) * multiplier * jobData.job_level);

            const now = new Date();
            const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
            const thaiTime = new Date(utcTime + (7 * 3600000));

            let lastUpdate = jobData.updated_at ? new Date(jobData.updated_at) : new Date(jobData.created_at);
            let lastUpdateThai = new Date(lastUpdate.getTime() + (7 * 3600000));

            let accrualsToAdd = 0;
            let cursor = new Date(lastUpdateThai);
            cursor.setHours(18, 0, 0, 0);
            if (lastUpdateThai < cursor) {
                cursor.setDate(cursor.getDate() - 1);
            }

            while (true) {
                cursor.setDate(cursor.getDate() + 1);
                cursor.setHours(18, 0, 0, 0);
                if (cursor <= thaiTime) {
                    accrualsToAdd++;
                } else {
                    break;
                }
            }

            if (accrualsToAdd > 0) {
                let newAccrued = Number(jobData.accrued_salary) + (effectiveSalary * accrualsToAdd);
                const { data: updated, error } = await supabase
                    .from('user_careers')
                    .update({ 
                        accrued_salary: newAccrued,
                        updated_at: new Date().toISOString() 
                    })
                    .eq('id', jobData.id)
                    .select('*, careers_catalog(*)')
                    .single();

                if (!error && updated) {
                    return updated;
                }
            }

            return jobData;
        }

        async function loadUserCareer() {
            const { data, error } = await supabase
                .from('user_careers')
                .select('*, careers_catalog(*)')
                .eq('user_id', currentUserId)
                .maybeSingle();

            if (!error && data) {
                userMainJob = await checkAndAccrueSalary(data);
            } else {
                userMainJob = null;
            }
            renderMainJobSection();
            renderSideJobsSection();
        }

        function getSkillBonusMultiplier(skillName) {
            let skill = userSkillsMap[skillName];
            if (!skill) return 1.0;
            let lv = skill.level;
            if (lv <= 1) return 1.0;
            if (lv === 2) return 1.05;
            if (lv === 3) return 1.10;
            if (lv === 4 || lv === 5) return 1.15;
            if (lv === 6 || lv === 7) return 1.20;
            if (lv === 8) return 1.25;
            if (lv === 9) return 1.30;
            if (lv >= 10) return 1.50;
            return 1.0;
        }

        function renderMainJobSection() {
            const container = document.getElementById('main-job-view-container');

            if (!userMainJob) {
                let mainCatalogs = careersCatalogData.filter(c => c.type === 'main');
                
                let html = `
                    <div class="royal-card p-6 rounded-3xl text-center space-y-3">
                        <div class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner border border-royal-200">👔</div>
                        <h3 class="font-bold text-sm text-royal-900 font-serif">คุณยังไม่มีงานหลักประจำสถาบัน</h3>
                        <p class="text-xs text-silver-500">เลือกสมัครงานหลักด้านล่างเพื่อเริ่มสร้างรายได้ประจำวัน (รับเงินทุกวัน เวลา 18:00 น.)</p>
                    </div>
                    <div class="space-y-3 pt-2">
                        <h3 class="text-sm font-bold text-royal-900 px-1 font-serif">📋 เลือกสมัครงานหลักใหม่</h3>
                        <div class="space-y-3">
                `;

                if (mainCatalogs.length === 0) {
                    html += '<p class="text-center text-xs text-silver-500 py-4 royal-card rounded-3xl">ยังไม่มีข้อมูลอาชีพงานหลักในระบบ</p>';
                } else {
                    mainCatalogs.forEach(c => {
                        let requiredSkill = c.required_skill_name;
                        let userSkillLevel = requiredSkill && userSkillsMap[requiredSkill] ? userSkillsMap[requiredSkill].level : 0;
                        let meetsRequirement = !requiredSkill || userSkillLevel >= c.required_skill_level;
                        let foodCostVal = c.food_cost !== undefined && c.food_cost !== null ? c.food_cost : 0;

                        html += `
                            <div class="bg-white p-4 rounded-3xl border border-royal-200 shadow-sm flex items-center justify-between gap-3 hover:border-royal-400 transition">
                                <div class="space-y-1">
                                    <h4 class="font-bold text-xs sm:text-sm text-royal-900 font-serif">💼 ${c.title}</h4>
                                    <p class="text-[11px] text-gray-600">รายได้: <strong class="text-royal-900">${Number(c.salary_or_reward).toLocaleString()} Silver/วัน</strong></p>
                                    <p class="text-[10px] text-silver-500">⚡ พลังงาน: ${c.energy_cost} | 🍲 อาหาร: ${foodCostVal}</p>
                                    ${requiredSkill ? `<p class="text-[10px] ${meetsRequirement ? 'text-emerald-600' : 'text-rose-600'} font-medium">ต้องการ: ${requiredSkill} (Lv.${c.required_skill_level})${meetsRequirement ? '✓ ผ่านเงื่อนไข' : '✗ ไม่ผ่าน'}</p>` : ''}
                                </div>
                                <button onclick="applyMainJob('${c.id}')" class="bg-royal-900 hover:bg-royal-800 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-sm shrink-0">
                                    สมัครงาน
                                </button>
                            </div>
                        `;
                    });
                }
                html += `</div></div>`;
                container.innerHTML = html;
            } else {
                let job = userMainJob.careers_catalog;
                let multiplier = getSkillBonusMultiplier(job.required_skill_name);
                let effectiveSalary = Math.round(Number(job.salary_or_reward) * multiplier * userMainJob.job_level);
                let foodCostVal = job.food_cost !== undefined && job.food_cost !== null ? job.food_cost : 0;
                let upgradeCost = userMainJob.job_level * 10000;

                container.innerHTML = `
                    <div class="space-y-4">
                        <div class="royal-card p-5 rounded-3xl space-y-4">
                            <div class="flex justify-between items-start border-b border-royal-200 pb-3">
                                <div class="space-y-1">
                                    <span class="bg-royal-100 text-royal-900 text-[10px] font-bold px-3 py-1 rounded-full shadow-sm border border-royal-200">👔 งานหลัก (Lv.${userMainJob.job_level})</span>
                                    <h3 class="text-lg font-extrabold text-royal-900 mt-1 font-serif">${job.title}</h3>
                                    <p class="text-[10px] text-royal-600 font-medium">⏰ รับเงินอัตโนมัติทุกวัน เวลา 18:00 น.</p>
                                </div>
                                <button onclick="quitMainJob()" class="text-rose-600 hover:text-rose-800 text-xs font-bold px-3.5 py-1.5 rounded-xl bg-rose-50 border border-rose-200 transition shadow-sm">ลาออกจากงาน</button>
                            </div>
                            
                            <div class="grid grid-cols-3 gap-2 bg-royal-50 p-4 rounded-2xl border border-royal-200 text-xs text-center">
                                <div>
                                    <span class="text-silver-500 block text-[10px]">รายได้สุทธิ (ต่อวัน)</span>
                                    <strong class="text-royal-900 text-sm sm:text-base">${effectiveSalary.toLocaleString()} Silver</strong>
                                    ${multiplier > 1 ? `<span class="text-[9px] text-emerald-600 block">(โบนัสสกิล x${multiplier})</span>` : ''}
                                </div>
                                <div>
                                    <span class="text-silver-500 block text-[10px]">พลังงานที่ใช้/วัน</span>
                                    <strong class="text-royal-900 text-sm sm:text-base">⚡ ${job.energy_cost}</strong>
                                </div>
                                <div>
                                    <span class="text-silver-500 block text-[10px]">อาหารที่ใช้/วัน</span>
                                    <strong class="text-emerald-700 text-sm sm:text-base">🍲 ${foodCostVal}</strong>
                                </div>
                            </div>
                        </div>

                        <div class="royal-card p-4 rounded-3xl flex items-center justify-between">
                            <div>
                                <span class="text-[10px] text-silver-500 block">เงินเดือนสะสมรอรับเข้าบัญชี</span>
                                <span class="text-lg font-extrabold text-royal-900">${parseFloat(userMainJob.accrued_salary).toLocaleString()} Silver</span>
                            </div>
                            <button onclick="claimSalary()" class="bg-royal-900 hover:bg-royal-800 text-white font-bold text-xs px-5 py-3 rounded-xl transition shadow-md">
                                รับเงินเดือน 💰
                            </button>
                        </div>

                        <div class="bg-purple-50/90 backdrop-blur-md p-5 rounded-3xl border border-purple-200 shadow-sm space-y-3">
                            <div class="flex justify-between items-center">
                                <div>
                                    <h4 class="text-xs font-bold text-purple-900 font-serif">⭐ ระบบเลื่อนตำแหน่งงาน</h4>
                                    <p class="text-[10px] text-purple-700 mt-0.5">การเลื่อนขั้นช่วยเพิ่มรายได้ประจำวันให้สูงขึ้นแบบไม่จำกัด</p>
                                </div>
                                <span class="bg-purple-200 text-purple-900 text-[10px] font-bold px-2.5 py-1 rounded-full shrink-0">Lv.${userMainJob.job_level} ➔ ${userMainJob.job_level + 1}</span>
                            </div>
                            <button onclick="upgradeJobLevel()" class="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold text-xs py-3 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                                <span>🚀 เลื่อนขั้นสู่ตำแหน่งถัดไป (${upgradeCost.toLocaleString()} Silver)</span>
                            </button>
                        </div>
                    </div>
                `;
            }
        }

        function renderSideJobsSection() {
            const container = document.getElementById('side-jobs-container');
            const sideCatalogs = careersCatalogData.filter(c => c.type === 'side');
            container.innerHTML = '';

            if (sideCatalogs.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-silver-500 py-6 royal-card rounded-3xl">ขณะนี้ยังไม่มีงานเสริมในระบบ</p>';
                return;
            }

            sideCatalogs.forEach(c => {
                let foodCostVal = c.food_cost !== undefined && c.food_cost !== null ? c.food_cost : 0;
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-3xl border border-royal-200 shadow-sm flex items-center justify-between gap-3 hover:border-royal-400 transition">
                        <div class="space-y-1">
                            <h4 class="font-bold text-xs sm:text-sm text-royal-900 font-serif">⚡ ${c.title}</h4>
                            <p class="text-[11px] text-gray-600">ค่าตอบแทน: <strong class="text-royal-900">${Number(c.salary_or_reward).toLocaleString()} Silver</strong></p>
                            <p class="text-[10px] text-silver-500">⚡ พลังงาน: ${c.energy_cost} | 🍲 อาหาร: ${foodCostVal} | ⏱️ ระยะเวลา: ${c.duration_minutes} นาที</p>
                        </div>
                        <button onclick="startSideJob('${c.id}', '${c.title}', ${c.salary_or_reward}, ${c.energy_cost}, ${foodCostVal}, ${c.duration_minutes}, '${c.required_skill_name || ''}')" class="bg-royal-900 hover:bg-royal-800 text-white font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-sm shrink-0">
                            เริ่มทำงาน
                        </button>
                    </div>
                `;
            });
        }

        async function applyMainJob(careerId) {
            let selectedJob = careersCatalogData.find(c => c.id === careerId);
            if (selectedJob && currentUserProfile) {
                let energyReq = selectedJob.energy_cost || 0;
                let foodReq = selectedJob.food_cost || 0;
                let currentEnergy = currentUserProfile.energy !== undefined ? currentUserProfile.energy : 100;
                let currentFood = currentUserProfile.food !== undefined ? currentUserProfile.food : 100;

                if (currentEnergy < energyReq) {
                    showModal("พลังงานไม่พอ", `งานนี้ต้องใช้พลังงาน ${energyReq} หน่วย แต่คุณเหลือ ${currentEnergy} หน่วย`, "⚡");
                    return;
                }
                if (currentFood < foodReq) {
                    showModal("หลอดอาหารไม่พอ", `งานนี้ต้องใช้อาหาร ${foodReq} หน่วย แต่คุณเหลือ ${currentFood} หน่วย`, "🍲");
                    return;
                }

                let newEnergy = currentEnergy - energyReq;
                let newFood = currentFood - foodReq;
                await supabase.from('profiles').update({ energy: newEnergy, food: newFood }).eq('id', currentUserId);
                currentUserProfile.energy = newEnergy;
                currentUserProfile.food = newFood;
            }

            const nowIso = new Date().toISOString();
            if (userMainJob) {
                await supabase.from('user_careers').update({ career_id: careerId, job_level: 1, updated_at: nowIso }).eq('id', userMainJob.id);
            } else {
                await supabase.from('user_careers').insert([{ user_id: currentUserId, career_id: careerId, job_level: 1, accrued_salary: 0, updated_at: nowIso }]);
            }
            showModal("สมัครงานสำเร็จ", "คุณได้เริ่มทำงานหลักนี้เรียบร้อยแล้ว", "⚜️", () => loadUserCareer());
        }

        async function quitMainJob() {
            if (!userMainJob) return;
            await supabase.from('user_careers').delete().eq('id', userMainJob.id);
            userMainJob = null;
            showModal("ลาออกจากงาน", "คุณได้ลาออกจากงานหลักปัจจุบันแล้ว", "👋", () => loadUserCareer());
        }

        async function claimSalary() {
            if (!userMainJob || userMainJob.accrued_salary <= 0) {
                showModal("ไม่มีเงินเดือนสะสม", "ยังไม่มีเงินเดือนให้กดรับในขณะนี้", "⚠️");
                return;
            }
            if (!activeBankAccount) {
                showModal("ไม่พบบัญชีธนาคาร", "กรุณาสร้างบัญชีธนาคารก่อนกดรับเงินเดือน", "⚠️");
                return;
            }

            let amount = Number(userMainJob.accrued_salary);
            let newSilver = Number(activeBankAccount.silver) + amount;

            await supabase.from('bank_accounts').update({ silver: newSilver }).eq('id', activeBankAccount.id);
            await supabase.from('user_careers').update({ accrued_salary: 0, updated_at: new Date().toISOString() }).eq('id', userMainJob.id);

            activeBankAccount.silver = newSilver;
            document.getElementById('user-silver-display').innerText = newSilver.toLocaleString() + ' Silver';
            userMainJob.accrued_salary = 0;

            showModal("รับเงินเดือนสำเร็จ", `คุณได้รับเงินเดือนเข้าบัญชี ${amount.toLocaleString()} Silver เรียบร้อยแล้ว`, "⚜️", () => renderMainJobSection());
        }

        async function upgradeJobLevel() {
            if (!userMainJob) return;
            let cost = userMainJob.job_level * 10000;

            if (!activeBankAccount || Number(activeBankAccount.silver) < cost) {
                showModal("เงินไม่พอ", `การเลื่อนขั้นต้องการเงิน ${cost.toLocaleString()} Silver แต่คุณมีเงินไม่เพียงพอ`, "💰");
                return;
            }

            let newSilver = Number(activeBankAccount.silver) - cost;
            let newJobLevel = userMainJob.job_level + 1;

            await supabase.from('bank_accounts').update({ silver: newSilver }).eq('id', activeBankAccount.id);
            await supabase.from('user_careers').update({ job_level: newJobLevel, updated_at: new Date().toISOString() }).eq('id', userMainJob.id);

            activeBankAccount.silver = newSilver;
            document.getElementById('user-silver-display').innerText = newSilver.toLocaleString() + ' Silver';
            userMainJob.job_level = newJobLevel;

            showModal("เลื่อนขั้นสำเร็จ", `ยินดีด้วย! คุณได้รับการเลื่อนขั้นเป็นตำแหน่งระดับ ${newJobLevel} แล้ว`, "⚜️", () => loadUserCareer());
        }

        function startSideJob(careerId, title, reward, energyCost, foodCost, durationMinutes, requiredSkill) {
            if (!currentUserProfile) return;

            let currentEnergy = currentUserProfile.energy !== undefined ? currentUserProfile.energy : 100;
            let currentFood = currentUserProfile.food !== undefined ? currentUserProfile.food : 100;

            if (currentEnergy < energyCost) {
                showModal("พลังงานไม่พอ", `งานนี้ต้องใช้พลังงาน ${energyCost} หน่วย แต่คุณเหลือ ${currentEnergy} หน่วย`, "⚡");
                return;
            }

            if (currentFood < foodCost) {
                showModal("หลอดอาหารไม่พอ", `งานนี้ต้องใช้อาหาร ${foodCost} หน่วย แต่คุณเหลือ ${currentFood} หน่วย`, "🍲");
                return;
            }

            if (requiredSkill) {
                let skill = userSkillsMap[requiredSkill];
                if (!skill || (skill.level <= 1 && skill.points <= 0)) {
                    showModal("สกิลไม่ถึง", `คุณยังไม่มีแต้มในทักษะ "${requiredSkill}" ที่จำเป็นสำหรับงานเสริมนี้`, "⚠️");
                    return;
                }
            }

            let multiplier = requiredSkill ? getSkillBonusMultiplier(requiredSkill) : 1.0;
            let finalReward = Math.round(reward * multiplier);
            let endTime = Date.now() + (durationMinutes * 60 * 1000);

            activeSideJob = { careerId, title, reward: finalReward, energyCost, foodCost, endTime };

            localStorage.setItem(`active_side_job_${currentUserId}`, JSON.stringify(activeSideJob));
            deductStatsForSideJob(energyCost, foodCost);
            renderActiveSideJobBox();
            showModal("เริ่มงานเสริมแล้ว", `คุณได้เริ่มทำงานเสริม "${title}" ระบบกำลังดำเนินการ กรุณารอสักครู่`, "⏳");
        }

        async function deductStatsForSideJob(energyCost, foodCost) {
            let newEnergy = (currentUserProfile.energy !== undefined ? currentUserProfile.energy : 100) - energyCost;
            let newFood = (currentUserProfile.food !== undefined ? currentUserProfile.food : 100) - foodCost;
            
            await supabase.from('profiles').update({ energy: newEnergy, food: newFood }).eq('id', currentUserId);
            currentUserProfile.energy = newEnergy;
            currentUserProfile.food = newFood;
        }

        function loadActiveSideJobFromStorage() {
            const saved = localStorage.getItem(`active_side_job_${currentUserId}`);
            if (saved) {
                activeSideJob = JSON.parse(saved);
                renderActiveSideJobBox();
            }
        }

        function renderActiveSideJobBox() {
            const box = document.getElementById('active-side-job-container');
            if (!activeSideJob) {
                box.innerHTML = '';
                if (timerInterval) clearInterval(timerInterval);
                return;
            }

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                let remaining = activeSideJob.endTime - Date.now();
                const timerEl = document.getElementById('side-job-timer');
                const actionBtn = document.getElementById('side-job-action-btn');

                if (remaining <= 0) {
                    if (timerEl) timerEl.innerText = "ทำงานเสร็จสิ้นแล้ว! พร้อมรับเงิน";
                    if (actionBtn) {
                        actionBtn.innerText = "กดรับเงินค่าจ้าง 🎁";
                        actionBtn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-md";
                        actionBtn.onclick = claimSideJobReward;
                    }
                    clearInterval(timerInterval);
                } else {
                    let mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                    let secs = Math.floor((remaining % (1000 * 60)) / 1000);
                    if (timerEl) timerEl.innerText = `⏳ เหลือเวลาอีก: ${mins} นาที ${secs < 10 ? '0' : ''}${secs} วินาที`;
                }
            }, 1000);

            let remaining = activeSideJob.endTime - Date.now();
            let isFinished = remaining <= 0;

            box.innerHTML = `
                <div class="royal-card p-5 rounded-3xl border-2 border-royal-300 shadow-md space-y-3">
                    <div class="flex items-center space-x-2">
                        <span class="w-8 h-8 rounded-full bg-royal-100 text-royal-900 flex items-center justify-center text-sm shadow-inner border border-royal-200">⚡</span>
                        <h3 class="font-bold text-xs text-royal-900 font-serif">งานเสริมที่กำลังทำ: ${activeSideJob.title}</h3>
                    </div>
                    <div class="bg-royal-50 p-3 rounded-2xl border border-royal-200 text-center space-y-1">
                        <p id="side-job-timer" class="text-xs font-bold text-royal-900">${isFinished ? "ทำงานเสร็จสิ้นแล้ว! พร้อมรับเงิน" : "กำลังคำนวณเวลา..."}</p>
                        <p class="text-[10px] text-silver-500">ค่าตอบแทนที่จะได้รับ: <strong class="text-royal-900">${activeSideJob.reward.toLocaleString()} Silver</strong></p>
                    </div>
                    <button id="side-job-action-btn" onclick="${isFinished ? 'claimSideJobReward()' : 'showModal(\"ยังไม่ถึงเวลา\", \"กรุณารอสักครู่จนกว่าจะครบกำหนดเวลา\", \"⏳\")'}" class="${isFinished ? 'w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-md' : 'w-full bg-gray-200 text-gray-500 font-bold text-xs py-2.5 rounded-xl cursor-not-allowed'}">
                        ${isFinished ? 'กดรับเงินค่าจ้าง 🎁' : 'กำลังดำเนินการทำงาน...'}
                    </button>
                </div>
            `;
        }

        async function claimSideJobReward() {
            if (!activeSideJob) return;
            if (!activeBankAccount) {
                showModal("ไม่พบบัญชีธนาคาร", "กรุณาสร้างบัญชีธนาคารก่อนรับเงิน", "⚠️");
                return;
            }

            let newSilver = Number(activeBankAccount.silver) + activeSideJob.reward;
            await supabase.from('bank_accounts').update({ silver: newSilver }).eq('id', activeBankAccount.id);

            activeBankAccount.silver = newSilver;
            document.getElementById('user-silver-display').innerText = newSilver.toLocaleString() + ' Silver';

            let earnedAmount = activeSideJob.reward;
            localStorage.removeItem(`active_side_job_${currentUserId}`);
            activeSideJob = null;
            renderActiveSideJobBox();

            showModal("รับเงินค่าจ้างสำเร็จ", `คุณได้รับเงิน ${earnedAmount.toLocaleString()} Silver เข้าธนาคารเรียบร้อยแล้ว`, "⚜️");
        }
    </script>
</body>
</html>
