<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmont C. - Store Management</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A1D4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- นำเข้าไฟล์ตั้งค่ากลาง -->
    <script src="supabase-config.js"></script>
    <script src="cloudinary-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            50: '#F4F7FB', 100: '#E8EEF7', 200: '#C8D6EB', 300: '#9CB4DB',
                            400: '#688BC7', 500: '#3B64B0', 600: '#1D438A', 700: '#143069',
                            800: '#0E2452', 900: '#0A1D4E', 950: '#050F2B',
                        },
                        silver: { 100: '#F8FAFC', 200: '#E2E8F0', 300: '#CBD5E1', 400: '#94A3B8', 500: '#64748B' }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'], serif: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: radial-gradient(circle at top, #F4F7FB 0%, #E2E8F0 100%); color: #0A1D4E; min-height: 100vh; }
        .royal-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border: 1.5px solid #C8D6EB; box-shadow: 0 10px 30px -10px rgba(10, 29, 78, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <div class="w-full max-w-2xl space-y-4">
        
        <!-- Header Nav -->
        <div class="border-b border-royal-200 pb-3 flex items-center justify-between">
            <div class="space-y-0.5">
                <button onclick="location.href='admin.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-royal-900 bg-royal-100 hover:bg-royal-200 px-3 py-1.5 rounded-xl transition border border-royal-200 shadow-sm">
                    <span>◀ กลับหน้าแดชบอร์ด</span>
                </button>
                <h1 class="text-base sm:text-lg font-extrabold text-royal-900 font-serif pt-1">🛍️ จัดการ Store (ร้านค้าทั่วไป)</h1>
            </div>
            <span class="bg-royal-900 text-white text-[9px] font-bold px-2.5 py-1 rounded-full shadow-sm">ADMIN</span>
        </div>

        <!-- ฟอร์มเพิ่มสินค้า -->
        <div class="royal-card p-4 sm:p-5 rounded-3xl space-y-3.5 shadow-sm">
            <h2 class="text-xs sm:text-sm font-bold text-royal-900 font-serif">➕ เพิ่มสินค้าใหม่เข้าร้านค้า</h2>
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-bold text-royal-900">ชื่อสินค้า</label>
                    <input type="text" id="item-name" placeholder="เช่น น้ำอัดลม, ข้าวผัด, แอปเปิ้ล" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                </div>

                <div>
                    <label class="text-[11px] font-bold text-royal-900">รูปภาพสินค้า (เลือกจากแกลเลอรี)</label>
                    <div class="flex items-center space-x-3 mt-1">
                        <label class="cursor-pointer bg-royal-50 hover:bg-royal-100 text-royal-900 border border-royal-200 font-bold text-xs px-4 py-2.5 rounded-2xl transition shadow-sm inline-flex items-center space-x-1">
                            <span>📁 เลือกรูปภาพ</span>
                            <input type="file" id="item-image-file" accept="image/*" class="hidden" onchange="previewImage(event)">
                        </label>
                        <span id="file-name-display" class="text-[11px] text-gray-400 truncate">ยังไม่ได้เลือกไฟล์</span>
                    </div>
                    <div id="image-preview-container" class="mt-2 hidden">
                        <img id="image-preview" class="w-16 h-16 rounded-2xl object-cover border border-royal-200 shadow-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">ราคา (Silver)</label>
                        <input type="number" id="item-price" placeholder="100" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">ประเภทการฟื้นฟู</label>
                        <div class="grid grid-cols-2 gap-1.5 mt-1">
                            <button type="button" id="type-energy-btn" onclick="selectEffectType('energy')" class="py-2 rounded-xl text-xs font-bold bg-royal-900 text-white shadow-sm transition">⚡ พลังงาน</button>
                            <button type="button" id="type-food-btn" onclick="selectEffectType('food')" class="py-2 rounded-xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition">🍗 อาหาร</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-bold text-royal-900">ค่าหน่วยที่ฟื้นฟู (แต้ม)</label>
                    <input type="number" id="item-effect-value" placeholder="25" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                </div>

                <button onclick="addNewStoreItem()" id="submit-btn" class="w-full bg-royal-900 hover:bg-royal-800 text-white font-bold text-xs py-3 rounded-2xl transition shadow-md">
                    วางขายสินค้า (Add to Store)
                </button>
            </div>
        </div>

        <!-- รายการสินค้าทั้งหมดในระบบ -->
        <div class="royal-card p-4 sm:p-5 rounded-3xl space-y-3 shadow-sm">
            <h2 class="text-xs sm:text-sm font-bold text-royal-900 font-serif">📋 รายการสินค้าที่มีวางขายในร้านค้าปัจจุบัน</h2>
            <div id="store-items-container" class="space-y-3">
                <p class="text-center text-xs text-silver-500 py-6">กำลังโหลดข้อมูลสินค้า...</p>
            </div>
        </div>

    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="custom-modal" class="fixed inset-0 bg-royal-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-royal-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-royal-200">⚜️</div>
            <h3 id="modal-title" class="text-lg font-bold text-royal-900 mb-2 font-serif">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-royal-900 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-royal-800 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        let selectedEffectType = 'energy';
        let selectedFile = null;

        function showModal(title, message, icon = '⚜️', cb = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            window.modalCallback = cb;
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); if(window.modalCallback) window.modalCallback(); }, 200);
        }

        function selectEffectType(type) {
            selectedEffectType = type;
            const energyBtn = document.getElementById('type-energy-btn');
            const foodBtn = document.getElementById('type-food-btn');

            if (type === 'energy') {
                energyBtn.className = "py-2 rounded-xl text-xs font-bold bg-royal-900 text-white shadow-sm transition";
                foodBtn.className = "py-2 rounded-xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition";
            } else {
                foodBtn.className = "py-2 rounded-xl text-xs font-bold bg-royal-900 text-white shadow-sm transition";
                energyBtn.className = "py-2 rounded-xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition";
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('file-name-display').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    preview.src = e.target.result;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') { window.location.href = 'home.html'; return; }
            await loadStoreItems();
        });

        async function loadStoreItems() {
            const { data: items } = await supabase.from('store_items').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('store-items-container');
            container.innerHTML = '';

            if (!items || items.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-silver-500 py-6">ยังไม่มีสินค้าในร้านค้า</p>';
                return;
            }

            items.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white p-3.5 rounded-2xl border border-royal-200 shadow-sm flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <img src="${item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150'}" class="w-12 h-12 rounded-2xl object-cover border border-royal-200 shadow-xs">
                            <div>
                                <h4 class="font-bold text-xs text-royal-900 font-serif">${item.name}</h4>
                                <p class="text-[10px] text-silver-500">ราคา: <span class="font-semibold text-royal-900">${item.price} Silver</span> | ฟื้นฟู ${item.effect_type === 'energy' ? 'พลังงาน' : 'อาหาร'} +${item.effect_value}</p>
                            </div>
                        </div>
                        <button onclick="deleteItem('${item.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs px-3 py-1.5 rounded-xl transition border border-red-200 shadow-xs">ลบ</button>
                    </div>
                `;
            });
        }

        async function addNewStoreItem() {
            const name = document.getElementById('item-name').value.trim();
            const price = parseFloat(document.getElementById('item-price').value);
            const effectValue = parseInt(document.getElementById('item-effect-value').value);

            if (!name || isNaN(price) || isNaN(effectValue)) {
                showModal("กรอกข้อมูลไม่ครบ", "กรุณากรอกชื่อสินค้า ราคา และค่าฟื้นฟูให้ครบถ้วน", "⚠️");
                return;
            }

            let imageUrl = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150';
            const submitBtn = document.getElementById('submit-btn');

            if (selectedFile) {
                try {
                    submitBtn.innerText = 'กำลังอัปโหลดรูปภาพ...';
                    submitBtn.disabled = true;
                    imageUrl = await uploadToCloudinary(selectedFile);
                    if (!imageUrl) {
                        submitBtn.innerText = 'วางขายสินค้า (Add to Store)';
                        submitBtn.disabled = false;
                        return;
                    }
                } catch (err) {
                    showModal("อัปโหลดรูปภาพไม่สำเร็จ", "เกิดข้อผิดพลาดในการอัปโหลดรูปไปยัง Cloudinary", "❌");
                    submitBtn.innerText = 'วางขายสินค้า (Add to Store)';
                    submitBtn.disabled = false;
                    return;
                }
            }

            const { error } = await supabase.from('store_items').insert([{
                name, image_url: imageUrl, price, effect_type: selectedEffectType, effect_value: effectValue
            }]);

            submitBtn.innerText = 'วางขายสินค้า (Add to Store)';
            submitBtn.disabled = false;

            if (error) {
                showModal("เกิดข้อผิดพลาด", error.message, "❌");
                return;
            }

            showModal("สำเร็จ! 🎉", "วางขายสินค้าใหม่เข้าร้านค้าเรียบร้อยแล้ว", "🛍️", () => {
                document.getElementById('item-name').value = '';
                document.getElementById('item-price').value = '';
                document.getElementById('item-effect-value').value = '';
                document.getElementById('item-image-file').value = '';
                document.getElementById('file-name-display').innerText = 'ยังไม่ได้เลือกไฟล์';
                document.getElementById('image-preview-container').classList.add('hidden');
                selectedFile = null;
                loadStoreItems();
            });
        }

        async function deleteItem(id) {
            const { error } = await supabase.from('store_items').delete().eq('id', id);
            if (error) { showModal("เกิดข้อผิดพลาด", error.message, "❌"); return; }
            showModal("ลบสินค้าสำเร็จ", "นำสินค้าออกจากระบบร้านค้าเรียบร้อยแล้ว", "🗑️", () => loadStoreItems());
        }
    </script>
</body>
</html>
