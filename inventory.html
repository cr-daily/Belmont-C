<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmont C. - คลังเก็บของ (Inventory)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A1D4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- นำเข้าไฟล์ตั้งค่ากลาง -->
    <script src="supabase-config.js"></script>
    <script src="cloudinary-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            50: '#F4F7FB',
                            100: '#E8EEF7',
                            200: '#C8D6EB',
                            300: '#9CB4DB',
                            400: '#688BC7',
                            500: '#3B64B0',
                            600: '#1D438A',
                            700: '#143069',
                            800: '#0E2452',
                            900: '#0A1D4E', // Royal Sapphire Navy
                            950: '#050F2B',
                        },
                        silver: {
                            100: '#F8FAFC',
                            200: '#E2E8F0',
                            300: '#CBD5E1',
                            400: '#94A3B8',
                            500: '#64748B',
                        }
                    },
                    fontFamily: { 
                        sans: ['Prompt', 'sans-serif'],
                        serif: ['Cinzel', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: radial-gradient(circle at top, #F4F7FB 0%, #E2E8F0 100%);
            color: #0A1D4E; 
            min-height: 100vh; 
        }
        .royal-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            border: 1.5px solid #C8D6EB;
            box-shadow: 0 10px 30px -10px rgba(10, 29, 78, 0.1);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8">

    <!-- Main Container -->
    <div class="w-full max-w-2xl space-y-6">
        
        <!-- Header Nav -->
        <div class="border-b border-royal-200 pb-4 mb-2 space-y-3">
            <div>
                <a href="home.html" class="inline-flex items-center space-x-1 text-xs font-bold text-royal-900 bg-royal-100 hover:bg-royal-200 px-4 py-2 rounded-xl transition border border-royal-200 shadow-sm">
                    <span>← กลับสู่หน้าหลักสถาบัน</span>
                </a>
            </div>
            <div>
                <h1 class="font-serif text-xl md:text-2xl font-extrabold text-royal-900 tracking-wide">🎒 คลังเก็บของส่วนตัว (Inventory)</h1>
            </div>
        </div>

        <!-- Section: รายการไอเท็มในคลัง -->
        <div class="space-y-4">
            <h3 class="text-xs font-bold text-royal-900 px-1 font-serif">ไอเท็มทั้งหมดในคลัง</h3>
            <div id="inventory-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- โหลดรายการไอเท็มจาก Supabase ผ่าน JS -->
            </div>
        </div>

    </div>

    <!-- Modal ส่งไอเท็มให้เพื่อน -->
    <div id="send-item-modal" class="fixed inset-0 bg-royal-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-royal-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="send-modal-box">
            <div class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-inner border border-royal-200">🎁</div>
            <h3 class="text-base font-bold text-royal-900 mb-1 font-serif">ส่งไอเท็มให้ผู้อื่น</h3>
            <p id="send-item-title" class="text-xs text-gray-500 mb-4">ส่งไอเท็ม...</p>
            
            <div class="space-y-3 text-left mb-5">
                <div>
                    <label class="block text-[11px] font-semibold text-royal-900 mb-1">เลขบัญชีผู้รับ หรือ ID</label>
                    <input type="text" id="recipient-input" placeholder="กรอกเลขบัญชี 10 หลัก หรือ ID" class="w-full px-3 py-2.5 rounded-xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                </div>
            </div>

            <div class="flex space-x-2">
                <button onclick="closeSendModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">ยกเลิก</button>
                <button onclick="executeSendItem()" class="flex-1 bg-royal-900 text-white py-2.5 rounded-xl text-xs font-semibold hover:bg-royal-800 transition shadow-md">ยืนยันการส่ง</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal ทั่วไป -->
    <div id="custom-modal" class="fixed inset-0 bg-royal-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-royal-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-royal-200">⚜️</div>
            <h3 id="modal-title" class="text-lg font-bold text-royal-900 mb-2">แจ้งเตือนสถาบัน</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-royal-900 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-royal-800 transition w-full shadow-md">รับทราบ</button>
        </div>
    </div>

    <script>
        let currentUserId = null;
        let userProfile = null;
        let selectedInventoryItem = null;

        function showModal(title, message, icon = '⚜️') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 200);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            currentUserId = session.user.id;

            await loadUserData();
            await loadInventory();
        });

        async function loadUserData() {
            const { data } = await supabase.from('profiles').select('*').eq('id', currentUserId).single();
            if (data) userProfile = data;
        }

        async function loadInventory() {
            const { data: inventory } = await supabase
                .from('inventories')
                .select('id, quantity, store_items (id, name, image_url, effect_type, effect_value)')
                .eq('user_id', currentUserId);

            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';

            if (!inventory || inventory.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-xs text-silver-500 py-8 royal-card rounded-3xl">คลังเก็บของว่างเปล่า (สามารถซื้อสินค้าได้ที่ Store)</p>';
                return;
            }

            inventory.forEach(inv => {
                const item = inv.store_items;
                if (!item) return;

                const card = document.createElement('div');
                card.className = "royal-card p-4 rounded-3xl flex items-center justify-between gap-3 shadow-sm";
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="relative">
                            <img src="${item.image_url || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=150'}" class="w-14 h-14 object-cover rounded-2xl shadow-inner border border-royal-100">
                            <span class="absolute -top-1.5 -right-1.5 bg-royal-900 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow">x${inv.quantity}</span>
                        </div>
                        <div>
                            <h4 class="font-bold text-xs text-royal-900">${item.name}</h4>
                            <p class="text-[11px] text-silver-500 mt-0.5">
                                ${item.effect_type === 'energy' ? `⚡ พลังงาน +${item.effect_value}` : `🍲 อาหาร +${item.effect_value}`}
                            </p>
                        </div>
                    </div>
                    <div class="flex flex-col space-y-1.5">
                        <button onclick="useItem('${inv.id}', '${item.effect_type}', ${item.effect_value}, '${item.name}', ${inv.quantity})" class="bg-royal-900 hover:bg-royal-800 text-white text-[10px] font-bold px-3 py-1.5 rounded-xl transition shadow-sm whitespace-nowrap">
                            ใช้ไอเท็ม
                        </button>
                        <button onclick="openSendModal('${inv.id}', '${item.name}')" class="bg-silver-200 hover:bg-silver-300 text-royal-900 text-[10px] font-semibold px-3 py-1 rounded-xl transition whitespace-nowrap">
                            ส่งให้ผู้อื่น
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function useItem(invId, effectType, effectValue, itemName, currentQty) {
            await loadUserData();

            const isEnergy = effectType === 'energy';
            const currentVal = isEnergy ? userProfile.energy : userProfile.food;
            const maxVal = isEnergy ? userProfile.max_energy : userProfile.max_food;

            if (currentVal >= maxVal) {
                showModal("ไม่สามารถใช้ได้", `${isEnergy ? 'หลอดพลังงาน' : 'หลอดอาหาร'}เต็มแล้ว ไม่สามารถใช้เพิ่มได้อีก`, "⚠️");
                return;
            }

            const newVal = Math.min(currentVal + effectValue, maxVal);
            const updatePayload = isEnergy ? { energy: newVal } : { food: newVal };

            await supabase.from('profiles').update(updatePayload).eq('id', currentUserId);

            if (currentQty > 1) {
                await supabase.from('inventories').update({ quantity: currentQty - 1 }).eq('id', invId);
            } else {
                await supabase.from('inventories').delete().eq('id', invId);
            }

            await loadInventory();
            showModal("ใช้งานสำเร็จ", `ใช้ "${itemName}" เรียบร้อยแล้ว (${isEnergy ? 'พลังงาน' : 'อาหาร'} +${effectValue})`, "⚜️");
        }

        function openSendModal(invId, itemName) {
            selectedInventoryItem = invId;
            document.getElementById('send-item-title').innerText = `ไอเท็ม: ${itemName} (ส่งครั้งละ 1 ชิ้น)`;
            document.getElementById('recipient-input').value = '';
            
            const modal = document.getElementById('send-item-modal');
            const box = document.getElementById('send-modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeSendModal() {
            const modal = document.getElementById('send-item-modal');
            const box = document.getElementById('send-modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); selectedInventoryItem = null; }, 200);
        }

        async function executeSendItem() {
            const recipientKey = document.getElementById('recipient-input').value.trim();
            if (!recipientKey) {
                showModal("ข้อมูลไม่ครบ", "กรุณากรอกเลขบัญชีหรือ ID ผู้รับ", "⚠️");
                return;
            }

            showModal("กำลังส่ง", "กำลังตรวจสอบและส่งไอเท็ม...", "⏳");

            let targetUserId = null;

            const { data: bankTarget } = await supabase.from('bank_accounts').select('user_id').eq('account_number', recipientKey).limit(1);
            if (bankTarget && bankTarget.length > 0) {
                targetUserId = bankTarget[0].user_id;
            } else {
                const { data: profileTarget } = await supabase.from('profiles').select('id').eq('custom_id', recipientKey).limit(1);
                if (profileTarget && profileTarget.length > 0) {
                    targetUserId = profileTarget[0].id;
                }
            }

            if (!targetUserId) {
                closeModal();
                showModal("ไม่พบผู้รับ", "ไม่พบเลขบัญชีหรือ ID ผู้รับในระบบ", "❌");
                return;
            }

            if (targetUserId === currentUserId) {
                closeModal();
                showModal("ไม่สามารถส่งได้", "ไม่สามารถส่งไอเท็มให้ตัวเองได้", "⚠️");
                return;
            }

            const { error: rpcError } = await supabase.rpc('transfer_inventory_item', {
                p_inventory_id: selectedInventoryItem,
                p_target_user_id: targetUserId
            });

            if (rpcError) {
                closeModal();
                showModal("เกิดข้อผิดพลาด", rpcError.message, "❌");
                return;
            }

            closeSendModal();
            await loadInventory();
            showModal("ส่งสำเร็จ", "ส่งไอเท็มให้ผู้รับเรียบร้อยแล้ว", "⚜️");
        }
    </script>
</body>
</html>
