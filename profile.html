<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmont C. - Profile</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A1D4E">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: { 50: '#F4F7FB', 100: '#E8EEF7', 200: '#C8D6EB', 800: '#0E2452', 900: '#0A1D4E', 950: '#050F2B' },
                        silver: { 100: '#F8FAFC', 200: '#E2E8F0', 300: '#CBD5E1', 500: '#64748B' }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'], serif: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: radial-gradient(circle at top, #F4F7FB 0%, #E2E8F0 100%); color: #0A1D4E; min-height: 100vh; }
        .royal-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border: 1.5px solid #C8D6EB; box-shadow: 0 10px 30px -10px rgba(10, 29, 78, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8">
    <div class="w-full max-w-xl space-y-6">
        
        <!-- 1) ปุ่มย้อนกลับหน้าหลักบรรทัดบนสุด -->
        <div>
            <a href="home.html" class="inline-flex items-center text-xs font-bold text-royal-900 bg-royal-100 hover:bg-royal-200 px-4 py-2 rounded-xl transition border border-royal-200">
                ← กลับสู่หน้าหลักสถาบัน
            </a>
        </div>

        <!-- 2) หัวข้อประจำหน้าบรรทัดเดียว -->
        <div class="flex items-center justify-between border-b border-royal-200 pb-3">
            <h1 class="font-serif text-xl md:text-2xl font-extrabold text-royal-900 tracking-wide">👤 บัตรประจำตัวและข้อมูลผู้เล่น</h1>
        </div>

        <!-- 3) แถบการ์ดยาวแสดงยอดเงิน (Silver) -->
        <div class="royal-card rounded-2xl p-4 flex items-center justify-between bg-gradient-to-r from-royal-900 to-royal-800 text-white shadow-md">
            <div class="flex items-center space-x-3">
                <div class="text-2xl">🪙</div>
                <div>
                    <p class="text-[10px] text-silver-300 uppercase tracking-widest">ยอดเงินคงเหลือในสถาบัน</p>
                    <h3 id="display-silver" class="text-lg font-bold">0.00 Silver</h3>
                </div>
            </div>
            <a href="bank.html" class="bg-silver-200/20 hover:bg-silver-200/30 text-xs px-3 py-1.5 rounded-xl transition border border-white/20">จัดการคลังทรัพย์สิน →</a>
        </div>

        <!-- ฟอร์มแก้ไขข้อมูลโปรไฟล์ -->
        <div class="royal-card rounded-3xl p-6 shadow-xl space-y-4">
            <div class="text-center pb-2">
                <div id="avatar-container" class="w-24 h-24 rounded-full overflow-hidden border-2 border-silver-300 shadow-md mx-auto mb-3 bg-royal-800 flex items-center justify-center text-white text-2xl font-bold">
                    <span>?</span>
                </div>
                <h3 id="profile-title-name" class="font-serif text-lg font-bold text-royal-900">กำลังโหลด...</h3>
                <p class="text-xs text-silver-500">ID: <span id="profile-custom-id">--------</span> | Rank: <span id="profile-role" class="uppercase font-bold">User</span></p>
            </div>

            <form id="profile-form" onsubmit="handleProfileUpdate(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-royal-900 mb-1">ลิงก์รูปโปรไฟล์ (Avatar URL)</label>
                    <input type="url" id="input-avatar" class="w-full px-4 py-2.5 rounded-xl border border-royal-200 bg-white text-sm focus:outline-none focus:border-royal-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-royal-900 mb-1">ชื่อ (Name)</label>
                    <input type="text" id="input-name" required class="w-full px-4 py-2.5 rounded-xl border border-royal-200 bg-white text-sm focus:outline-none focus:border-royal-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-royal-900 mb-1">ชื่อเต็ม (Full Name)</label>
                    <input type="text" id="input-fullname" required class="w-full px-4 py-2.5 rounded-xl border border-royal-200 bg-white text-sm focus:outline-none focus:border-royal-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-royal-900 mb-1">ชื่ออาณาจักร (Kingdom)</label>
                    <input type="text" id="input-kingdom" placeholder="เช่น อาณาจักรเบลมอนต์" class="w-full px-4 py-2.5 rounded-xl border border-royal-200 bg-white text-sm focus:outline-none focus:border-royal-700">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-royal-900 mb-1">สถานะ / ยศ (Status)</label>
                    <input type="text" id="input-status" placeholder="เช่น นักเรียนปี 1 / ขุนนางชั้นสูง" class="w-full px-4 py-2.5 rounded-xl border border-royal-200 bg-white text-sm focus:outline-none focus:border-royal-700">
                </div>

                <button type="submit" class="w-full bg-royal-900 hover:bg-royal-800 text-white py-3 rounded-xl font-bold text-sm shadow-lg transition">
                    บันทึกข้อมูลโปรไฟล์
                </button>
            </form>
        </div>
    </div>

    <!-- Script ควบคุมโปรไฟล์ -->
    <script>
        const SUPABASE_URL = 'https://efzmhzhirzxiysnjkbty.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_z4_JEmggyRABRF86Ao6_8A_3BwwnXA7';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const userId = session.user.id;

            // ดึงข้อมูลโปรไฟล์และบัญชีธนาคาร
            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
            const { data: bank } = await supabaseClient.from('bank_accounts').select('silver').eq('user_id', userId).single();

            if (profile) {
                document.getElementById('input-name').value = profile.name || '';
                document.getElementById('input-fullname').value = profile.fullname || '';
                document.getElementById('input-kingdom').value = profile.kingdom || '';
                document.getElementById('input-status').value = profile.status || '';
                document.getElementById('input-avatar').value = profile.avatar || '';
                document.getElementById('profile-title-name').innerText = profile.name || 'สมาชิกสถาบัน';
                document.getElementById('profile-custom-id').innerText = profile.custom_id || '--------';
                document.getElementById('profile-role').innerText = profile.role || 'User';

                const avatarBox = document.getElementById('avatar-container');
                if (profile.avatar && profile.avatar.startsWith('http')) {
                    avatarBox.innerHTML = `<img src="${profile.avatar}" class="w-full h-full object-cover">`;
                } else {
                    avatarBox.innerHTML = `<span class="text-2xl font-bold text-white">${profile.name ? profile.name.charAt(0).toUpperCase() : '?'}</span>`;
                }
            }

            if (bank) {
                document.getElementById('display-silver').innerText = `${Number(bank.silver).toLocaleString('en-US', {minimumFractionDigits: 2})} Silver`;
            }
        });

        async function handleProfileUpdate(e) {
            e.preventDefault();
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return;

            const updates = {
                name: document.getElementById('input-name').value.trim(),
                fullname: document.getElementById('input-fullname').value.trim(),
                kingdom: document.getElementById('input-kingdom').value.trim(),
                status: document.getElementById('input-status').value.trim(),
                avatar: document.getElementById('input-avatar').value.trim()
            };

            const { error } = await supabaseClient.from('profiles').update(updates).eq('id', session.user.id);
            if (error) {
                alert('เกิดข้อผิดพลาดในการบันทึก: ' + error.message);
            } else {
                alert('บันทึกข้อมูลโปรไฟล์เรียบร้อยแล้ว!');
                location.reload();
            }
        }
    </script>
</body>
</html>
