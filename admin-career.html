<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmont C. - Career Management</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A1D4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- นำเข้าไฟล์ตั้งค่ากลาง -->
    <script src="supabase-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            50: '#F4F7FB', 100: '#E8EEF7', 200: '#C8D6EB', 300: '#9CB4DB',
                            400: '#688BC7', 500: '#3B64B0', 600: '#1D438A', 700: '#143069',
                            800: '#0E2452', 900: '#0A1D4E', 950: '#050F2B',
                        },
                        silver: { 100: '#F8FAFC', 200: '#E2E8F0', 300: '#CBD5E1', 400: '#94A3B8', 500: '#64748B' }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'], serif: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: radial-gradient(circle at top, #F4F7FB 0%, #E2E8F0 100%); color: #0A1D4E; min-height: 100vh; }
        .royal-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border: 1.5px solid #C8D6EB; box-shadow: 0 10px 30px -10px rgba(10, 29, 78, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <div class="w-full max-w-2xl space-y-4">
        
        <!-- Header Nav -->
        <div class="border-b border-royal-200 pb-3 flex items-center justify-between">
            <div class="space-y-0.5">
                <button onclick="location.href='admin.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-royal-900 bg-royal-100 hover:bg-royal-200 px-3 py-1.5 rounded-xl transition border border-royal-200 shadow-sm">
                    <span>◀ กลับหน้าแดชบอร์ด</span>
                </button>
                <h1 class="text-base sm:text-lg font-extrabold text-royal-900 font-serif pt-1">💼 จัดการ Career (งานหลักและงานเสริม)</h1>
            </div>
            <span class="bg-royal-900 text-white text-[9px] font-bold px-2.5 py-1 rounded-full shadow-sm">ADMIN</span>
        </div>

        <!-- ฟอร์มเพิ่มอาชีพใหม่ -->
        <div class="royal-card p-4 sm:p-5 rounded-3xl space-y-3.5 shadow-sm">
            <h2 class="text-xs sm:text-sm font-bold text-royal-900 font-serif">➕ เพิ่มอาชีพใหม่ในระบบ</h2>
            <div class="space-y-3">
                
                <div>
                    <label class="text-[11px] font-bold text-royal-900">ประเภทงาน</label>
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <button type="button" id="type-main-btn" onclick="selectCareerType('main')" class="py-2.5 px-3 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1">
                            <span>👔 งานหลัก (Main Job)</span>
                        </button>
                        <button type="button" id="type-side-btn" onclick="selectCareerType('side')" class="py-2.5 px-3 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1">
                            <span>⚡ งานเสริม (Side Job)</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-bold text-royal-900">ชื่ออาชีพ</label>
                    <input type="text" id="career-title" placeholder="เช่น ศัลยแพทย์, พนักงานพาร์ทไทม์" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label id="salary-label" class="text-[11px] font-bold text-royal-900">รายได้ (Silver ต่อวัน/งาน)</label>
                        <input type="number" id="career-salary" placeholder="20000" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">พลังงานที่ใช้ (Energy Cost)</label>
                        <input type="number" id="career-energy" placeholder="30" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">อาหารที่ใช้ (Food Cost)</label>
                        <input type="number" id="career-food" placeholder="20" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                </div>

                <div id="duration-box" class="hidden">
                    <label class="text-[11px] font-bold text-royal-900">ระยะเวลาทำงานเสริม (นาที)</label>
                    <input type="number" id="career-duration" placeholder="30" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner" value="30">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">ทักษะที่ต้องใช้ (Required Skill)</label>
                        <select id="career-required-skill" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs focus:outline-none focus:border-royal-700 bg-white shadow-inner">
                            <option value="">-- ไม่กำหนดทักษะ --</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">เลเวลสกิลขั้นต่ำ</label>
                        <input type="number" id="career-required-level" placeholder="1" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner" value="1">
                    </div>
                </div>

                <button onclick="addNewCareerCatalog()" class="w-full bg-royal-900 hover:bg-royal-800 text-white font-bold text-xs py-3 rounded-2xl transition shadow-md">
                    บันทึกอาชีพ (Save Career)
                </button>
            </div>
        </div>

        <!-- รายการอาชีพทั้งหมดในระบบ -->
        <div class="royal-card p-4 sm:p-5 rounded-3xl space-y-3 shadow-sm">
            <h2 class="text-xs sm:text-sm font-bold text-royal-900 font-serif">📋 รายชื่ออาชีพที่มีในระบบปัจจุบัน</h2>
            <div id="careers-catalog-container" class="space-y-3">
                <p class="text-center text-xs text-silver-500 py-6">กำลังโหลดข้อมูลอาชีพ...</p>
            </div>
        </div>

    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="custom-modal" class="fixed inset-0 bg-royal-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-royal-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-royal-200">⚜️</div>
            <h3 id="modal-title" class="text-lg font-bold text-royal-900 mb-2 font-serif">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-royal-900 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-royal-800 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        let selectedCareerType = 'main';

        function showModal(title, message, icon = '⚜️', cb = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            window.modalCallback = cb;
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); if(window.modalCallback) window.modalCallback(); }, 200);
        }

        function selectCareerType(type) {
            selectedCareerType = type;
            const mainBtn = document.getElementById('type-main-btn');
            const sideBtn = document.getElementById('type-side-btn');
            const durationBox = document.getElementById('duration-box');
            const salaryLabel = document.getElementById('salary-label');

            if (type === 'main') {
                mainBtn.className = "py-2.5 px-3 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1";
                sideBtn.className = "py-2.5 px-3 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1";
                durationBox.classList.add('hidden');
                salaryLabel.innerText = "รายได้ (Silver ต่อวัน)";
            } else {
                sideBtn.className = "py-2.5 px-3 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1";
                mainBtn.className = "py-2.5 px-3 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1";
                durationBox.classList.remove('hidden');
                salaryLabel.innerText = "รายได้ (Silver ต่อครั้ง)";
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') { 
                showModal("Access Denied", "คุณไม่มีสิทธิ์เข้าถึงหน้าผู้ดูแลระบบนี้", "🚫", () => {
                    window.location.href = 'home.html';
                });
                return;
            }

            await loadSkillsDropdown();
            await loadCareersCatalog();
        });

        async function loadSkillsDropdown() {
            const { data: catalog } = await supabase.from('skills_catalog').select('title, exclusive_skill_name');
            const selectDropdown = document.getElementById('career-required-skill');
            selectDropdown.innerHTML = '<option value="">-- ไม่กำหนดทักษะ --</option>';

            if (catalog) {
                const uniqueSkills = new Set();
                catalog.forEach(s => {
                    if (s.title) uniqueSkills.add(s.title);
                    if (s.exclusive_skill_name) uniqueSkills.add(s.exclusive_skill_name);
                });

                uniqueSkills.forEach(skillName => {
                    selectDropdown.innerHTML += `<option value="${skillName}">${skillName}</option>`;
                });
            }
        }

        async function loadCareersCatalog() {
            const { data: careers, error } = await supabase.from('careers_catalog').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('careers-catalog-container');
            container.innerHTML = '';

            if (error || !careers || careers.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-silver-500 py-6">ยังไม่มีข้อมูลอาชีพในระบบ</p>';
                return;
            }

            careers.forEach(c => {
                const foodCostVal = c.food_cost !== undefined && c.food_cost !== null ? c.food_cost : 0;
                container.innerHTML += `
                    <div class="royal-card p-3.5 rounded-3xl shadow-sm flex items-center justify-between">
                        <div class="space-y-0.5">
                            <span class="text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm ${c.type === 'main' ? 'bg-royal-50 text-royal-900 border border-royal-200' : 'bg-royal-100 text-royal-800 border border-royal-200'}">
                                ${c.type === 'main' ? 'MAIN JOB (งานหลัก)' : 'SIDE JOB (งานเสริม)'}
                            </span>
                            <h4 class="font-bold text-xs text-royal-900 font-serif mt-1">${c.title}</h4>
                            <p class="text-[10px] text-silver-500">รายได้: <span class="font-semibold text-royal-900">${Number(c.salary_or_reward).toLocaleString()} Silver</span> | พลังงาน: ${c.energy_cost} | อาหาร: ${foodCostVal} ${c.type === 'side' ? `| เวลา: ${c.duration_minutes} นาที` : ''}</p>
                            ${c.required_skill_name ? `<p class="text-[10px] text-royal-600 font-semibold">ทักษะที่ต้องการ: ${c.required_skill_name} (Lv.${c.required_skill_level})</p>` : ''}
                        </div>
                        <button onclick="deleteCareerCatalog('${c.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs px-3 py-1.5 rounded-xl transition shadow-xs border border-red-200 shrink-0">ลบ</button>
                    </div>
                `;
            });
        }

        async function addNewCareerCatalog() {
            const title = document.getElementById('career-title').value.trim();
            const salaryOrReward = parseFloat(document.getElementById('career-salary').value);
            const energyCost = parseInt(document.getElementById('career-energy').value) || 0;
            const foodCost = parseInt(document.getElementById('career-food').value) || 0;
            const durationMinutes = selectedCareerType === 'side' ? parseInt(document.getElementById('career-duration').value) : 0;
            const requiredSkillName = document.getElementById('career-required-skill').value;
            const requiredSkillLevel = parseInt(document.getElementById('career-required-level').value) || 1;

            if (!title || isNaN(salaryOrReward)) {
                showModal("กรอกข้อมูลไม่ครบ", "กรุณากรอกชื่ออาชีพและรายได้ให้ครบถ้วนถูกต้อง", "⚠️");
                return;
            }

            const { error } = await supabase.from('careers_catalog').insert([{
                title,
                type: selectedCareerType,
                salary_or_reward: salaryOrReward,
                energy_cost: energyCost,
                food_cost: foodCost,
                duration_minutes: durationMinutes,
                required_skill_name: requiredSkillName || null,
                required_skill_level: requiredSkillLevel
            }]);

            if (error) { 
                showModal("เกิดข้อผิดพลาด", error.message, "❌"); 
                return; 
            }

            showModal("บันทึกสำเร็จ! 🎉", "เพิ่มอาชีพใหม่เข้าสู่ระบบเรียบร้อยแล้ว", "💼", () => {
                document.getElementById('career-title').value = '';
                document.getElementById('career-salary').value = '';
                document.getElementById('career-energy').value = '';
                document.getElementById('career-food').value = '';
                document.getElementById('career-duration').value = '30';
                document.getElementById('career-required-skill').value = '';
                document.getElementById('career-required-level').value = '1';
                loadCareersCatalog();
            });
        }

        async function deleteCareerCatalog(id) {
            const { error } = await supabase.from('careers_catalog').delete().eq('id', id);
            if (error) { 
                showModal("เกิดข้อผิดพลาด", error.message, "❌"); 
                return; 
            }
            showModal("ลบอาชีพสำเร็จ", "ลบข้อมูลอาชีพออกจากระบบแล้ว", "🗑️", () => loadCareersCatalog());
        }
    </script>
</body>
</html>
