<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmont C. - Learnify Management</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A1D4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png">
    
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- นำเข้าไฟล์ตั้งค่ากลาง -->
    <script src="supabase-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            50: '#F4F7FB', 100: '#E8EEF7', 200: '#C8D6EB', 300: '#9CB4DB',
                            400: '#688BC7', 500: '#3B64B0', 600: '#1D438A', 700: '#143069',
                            800: '#0E2452', 900: '#0A1D4E', 950: '#050F2B',
                        },
                        silver: { 100: '#F8FAFC', 200: '#E2E8F0', 300: '#CBD5E1', 400: '#94A3B8', 500: '#64748B' }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'], serif: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: radial-gradient(circle at top, #F4F7FB 0%, #E2E8F0 100%); color: #0A1D4E; min-height: 100vh; }
        .royal-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border: 1.5px solid #C8D6EB; box-shadow: 0 10px 30px -10px rgba(10, 29, 78, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <div class="w-full max-w-2xl space-y-4">
        
        <!-- Header Nav -->
        <div class="border-b border-royal-200 pb-3 flex items-center justify-between">
            <div class="space-y-0.5">
                <button onclick="location.href='admin.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-royal-900 bg-royal-100 hover:bg-royal-200 px-3 py-1.5 rounded-xl transition border border-royal-200 shadow-sm">
                    <span>◀ กลับหน้าแดชบอร์ด</span>
                </button>
                <h1 class="text-base sm:text-lg font-extrabold text-royal-900 font-serif pt-1">📚 จัดการ Learnify (หลักสูตรและการเรียนรู้)</h1>
            </div>
            <span class="bg-royal-900 text-white text-[9px] font-bold px-2.5 py-1 rounded-full shadow-sm">ADMIN</span>
        </div>

        <!-- ฟอร์มเพิ่มหลักสูตร -->
        <div class="royal-card p-4 sm:p-5 rounded-3xl space-y-3.5 shadow-sm">
            <h2 class="text-xs sm:text-sm font-bold text-royal-900 font-serif">➕ เพิ่มหลักสูตรการเรียนรู้ใหม่</h2>
            <div class="space-y-3">
                
                <div>
                    <label class="text-[11px] font-bold text-royal-900">ประเภทหลักสูตร</label>
                    <div class="grid grid-cols-2 gap-2 mt-1">
                        <button type="button" id="cat-general-btn" onclick="selectCategory('general')" class="py-2.5 px-3 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1">
                            <span>📖 General Skill</span>
                        </button>
                        <button type="button" id="cat-uni-btn" onclick="selectCategory('university')" class="py-2.5 px-3 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1">
                            <span>🎓 University Skill</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label id="title-label" class="text-[11px] font-bold text-royal-900">ชื่อหัวข้อหลักสูตร</label>
                    <input type="text" id="skill-title" placeholder="เช่น การทำอาหาร" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                </div>

                <div id="university-specific-box" class="hidden space-y-3 bg-royal-50 p-4 rounded-2xl border border-royal-200">
                    <h3 class="text-xs font-bold text-royal-900 font-serif">🎓 ตั้งค่าสกิลที่จะได้รับจากคณะนี้</h3>
                    
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">เลือกสกิลที่มีอยู่แล้ว (จาก General Skill)</label>
                        <select id="linked-existing-skill" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs focus:outline-none focus:border-royal-700 bg-white mt-1 shadow-inner">
                            <option value="">-- เลือกสกิลที่มีอยู่แล้ว (ถ้ามี) --</option>
                        </select>
                    </div>

                    <div class="relative flex py-1 items-center">
                        <div class="flex-grow border-t border-royal-200"></div>
                        <span class="flex-shrink mx-4 text-[10px] text-silver-500 font-semibold">หรือ หากเป็นสกิลใหม่เฉพาะทาง</span>
                        <div class="flex-grow border-t border-royal-200"></div>
                    </div>

                    <div>
                        <label class="text-[11px] font-bold text-royal-900">ชื่อสกิลเฉพาะทาง (Exclusive Skill Name)</label>
                        <input type="text" id="skill-exclusive-name" placeholder="เช่น ทักษะการแพทย์ (เฉพาะมหาลัย)" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs focus:outline-none focus:border-royal-700 bg-white shadow-inner">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">ค่าใช้จ่ายต่อคาบ (Silver)</label>
                        <input type="number" id="skill-cost-silver" placeholder="50" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">พลังงานที่ใช้ (Energy)</label>
                        <input type="number" id="skill-cost-energy" placeholder="15" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">แต้มสกิลที่จะได้รับต่อคาบ (+Points)</label>
                        <input type="number" id="skill-reward-points" placeholder="50" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                    <div id="target-sessions-box" class="hidden">
                        <label class="text-[11px] font-bold text-royal-900">เป้าหมายคาบเรียนจบหลักสูตร</label>
                        <input type="number" id="skill-target-sessions" placeholder="10" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner" value="10">
                    </div>
                </div>

                <button onclick="addNewSkillCatalog()" class="w-full bg-royal-900 hover:bg-royal-800 text-white font-bold text-xs py-3 rounded-2xl transition shadow-md">
                    บันทึกหลักสูตร (Save Course)
                </button>
            </div>
        </div>

        <!-- รายการหลักสูตรทั้งหมดในระบบ -->
        <div class="royal-card p-4 sm:p-5 rounded-3xl space-y-3 shadow-sm">
            <h2 class="text-xs sm:text-sm font-bold text-royal-900 font-serif">📋 รายชื่อหลักสูตรที่มีในระบบปัจจุบัน</h2>
            <div id="skills-catalog-container" class="space-y-3">
                <p class="text-center text-xs text-silver-500 py-6">กำลังโหลดข้อมูลหลักสูตร...</p>
            </div>
        </div>

    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="custom-modal" class="fixed inset-0 bg-royal-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-royal-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-royal-200">⚜️</div>
            <h3 id="modal-title" class="text-lg font-bold text-royal-900 mb-2 font-serif">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-royal-900 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-royal-800 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        let selectedCategory = 'general';
        let existingGeneralSkills = [];

        function showModal(title, message, icon = '⚜️', cb = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            window.modalCallback = cb;
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); if(window.modalCallback) window.modalCallback(); }, 200);
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            const generalBtn = document.getElementById('cat-general-btn');
            const uniBtn = document.getElementById('cat-uni-btn');
            const targetBox = document.getElementById('target-sessions-box');
            const uniBox = document.getElementById('university-specific-box');
            const titleLabel = document.getElementById('title-label');
            const titleInput = document.getElementById('skill-title');

            if (cat === 'general') {
                generalBtn.className = "py-2.5 px-3 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1";
                uniBtn.className = "py-2.5 px-3 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1";
                targetBox.classList.add('hidden');
                uniBox.classList.add('hidden');
                titleLabel.innerText = "ชื่อหัวข้อหลักสูตร / ชื่อสกิล";
                titleInput.placeholder = "เช่น การทำอาหาร, การคำนวณ";
            } else {
                uniBtn.className = "py-2.5 px-3 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1";
                generalBtn.className = "py-2.5 px-3 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1";
                targetBox.classList.remove('hidden');
                uniBox.classList.remove('hidden');
                titleLabel.innerText = "ชื่อคณะ (University Faculty Name)";
                titleInput.placeholder = "เช่น คณะคหกรรมศาสตร์, คณะแพทยศาสตร์";
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') { 
                showModal("Access Denied", "คุณไม่มีสิทธิ์เข้าถึงหน้าผู้ดูแลระบบนี้", "🚫", () => {
                    window.location.href = 'home.html';
                });
                return;
            }

            await loadSkillsCatalog();
        });

        async function loadSkillsCatalog() {
            const { data: catalog, error } = await supabase.from('skills_catalog').select('*').order('created_at', { ascending: false });
            const container = document.getElementById('skills-catalog-container');
            const selectDropdown = document.getElementById('linked-existing-skill');
            
            container.innerHTML = '';
            selectDropdown.innerHTML = '<option value="">-- เลือกสกิลที่มีอยู่แล้ว (ถ้ามี) --</option>';
            existingGeneralSkills = [];

            if (error || !catalog || catalog.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-silver-500 py-6">ยังไม่มีหลักสูตรการเรียนรู้ในระบบ</p>';
                return;
            }

            catalog.forEach(s => {
                if (s.category === 'general') {
                    existingGeneralSkills.push(s.title);
                    selectDropdown.innerHTML += `<option value="${s.title}">${s.title}</option>`;
                }

                const skillBadgeText = s.category === 'university' 
                    ? `สกิลที่ได้รับ: ${s.exclusive_skill_name || 'ตามหลักสูตรทั่วไป'}` 
                    : `สกิล: ${s.title}`;

                container.innerHTML += `
                    <div class="royal-card p-3.5 rounded-3xl shadow-sm flex items-center justify-between">
                        <div class="space-y-0.5">
                            <span class="text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm ${s.category === 'university' ? 'bg-royal-100 text-royal-900 border border-royal-200' : 'bg-royal-50 text-royal-800 border border-royal-200'}">
                                ${s.category === 'university' ? 'UNIVERSITY SKILL' : 'GENERAL SKILL'}
                            </span>
                            <h4 class="font-bold text-xs text-royal-900 font-serif mt-1">${s.title}</h4>
                            <p class="text-[10px] text-silver-500">${skillBadgeText} | ค่าเรียน: ${s.cost_silver} Silver | พลังงาน: ${s.cost_energy} | แต้ม: +${s.reward_points} ${s.category === 'university' ? `| เป้าหมาย: ${s.target_sessions} คาบ` : ''}</p>
                        </div>
                        <button onclick="deleteSkillCatalog('${s.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs px-3 py-1.5 rounded-xl transition shadow-xs border border-red-200 shrink-0">ลบ</button>
                    </div>
                `;
            });
        }

        async function addNewSkillCatalog() {
            const title = document.getElementById('skill-title').value.trim();
            const costSilver = parseFloat(document.getElementById('skill-cost-silver').value);
            const costEnergy = parseInt(document.getElementById('skill-cost-energy').value);
            const rewardPoints = parseInt(document.getElementById('skill-reward-points').value);
            const targetSessions = selectedCategory === 'university' ? parseInt(document.getElementById('skill-target-sessions').value) : 1;
            
            let exclusiveName = '';
            if (selectedCategory === 'university') {
                const linkedSkill = document.getElementById('linked-existing-skill').value;
                const customExclusive = document.getElementById('skill-exclusive-name').value.trim();
                
                if (linkedSkill) {
                    exclusiveName = linkedSkill;
                } else if (customExclusive) {
                    exclusiveName = customExclusive;
                } else {
                    showModal("ข้อมูลไม่ครบถ้วน", "กรุณาเลือกสกิลที่มีอยู่แล้ว หรือระบุชื่อสกิลเฉพาะทางสำหรับคณะนี้", "⚠️");
                    return;
                }
            } else {
                exclusiveName = title;
            }

            if (!title || isNaN(costSilver) || isNaN(costEnergy) || isNaN(rewardPoints)) {
                showModal("กรอกข้อมูลไม่ครบ", "กรุณากรอกชื่อหลักสูตรและค่าใช้จ่ายให้ครบถ้วนถูกต้อง", "⚠️");
                return;
            }

            const { error } = await supabase.from('skills_catalog').insert([{
                category: selectedCategory,
                title,
                cost_silver: costSilver,
                cost_energy: costEnergy,
                reward_points: rewardPoints,
                target_sessions: targetSessions,
                exclusive_skill_name: exclusiveName
            }]);

            if (error) { 
                showModal("เกิดข้อผิดพลาด", error.message, "❌"); 
                return; 
            }

            showModal("บันทึกสำเร็จ! 🎉", "เพิ่มหลักสูตรการเรียนรู้ใหม่เข้าสู่ระบบเรียบร้อยแล้ว", "📚", () => {
                document.getElementById('skill-title').value = '';
                document.getElementById('skill-cost-silver').value = '';
                document.getElementById('skill-cost-energy').value = '';
                document.getElementById('skill-reward-points').value = '';
                document.getElementById('skill-exclusive-name').value = '';
                document.getElementById('linked-existing-skill').value = '';
                loadSkillsCatalog();
            });
        }

        async function deleteSkillCatalog(id) {
            const { error } = await supabase.from('skills_catalog').delete().eq('id', id);
            if (error) { 
                showModal("เกิดข้อผิดพลาด", error.message, "❌"); 
                return; 
            }
            showModal("ลบหลักสูตรสำเร็จ", "ลบข้อมูลหลักสูตรออกจากระบบแล้ว", "🗑️", () => loadSkillsCatalog());
        }
    </script>
</body>
</html>
