<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belmont C. - Estate Management</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0A1D4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://res.cloudinary.com/dp6k1rwj/image/upload/v1794483770/file_00000000a1cc82118c32b6b1b3e0fa76.png">

    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- นำเข้าไฟล์ตั้งค่ากลาง -->
    <script src="supabase-config.js"></script>
    <script src="cloudinary-config.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            50: '#F4F7FB', 100: '#E8EEF7', 200: '#C8D6EB', 300: '#9CB4DB',
                            400: '#688BC7', 500: '#3B64B0', 600: '#1D438A', 700: '#143069',
                            800: '#0E2452', 900: '#0A1D4E', 950: '#050F2B',
                        },
                        silver: { 100: '#F8FAFC', 200: '#E2E8F0', 300: '#CBD5E1', 400: '#94A3B8', 500: '#64748B' }
                    },
                    fontFamily: { sans: ['Prompt', 'sans-serif'], serif: ['Cinzel', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Prompt', sans-serif; background: radial-gradient(circle at top, #F4F7FB 0%, #E2E8F0 100%); color: #0A1D4E; min-height: 100vh; }
        .royal-card { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); border: 1.5px solid #C8D6EB; box-shadow: 0 10px 30px -10px rgba(10, 29, 78, 0.1); }
    </style>
</head>
<body class="flex flex-col items-center justify-start p-4 md:p-8 pb-20">

    <div class="w-full max-w-2xl space-y-4">
        
        <!-- Header Nav -->
        <div class="border-b border-royal-200 pb-3 flex items-center justify-between">
            <div class="space-y-0.5">
                <button onclick="location.href='admin.html'" class="inline-flex items-center space-x-1 text-xs font-bold text-royal-900 bg-royal-100 hover:bg-royal-200 px-3 py-1.5 rounded-xl transition border border-royal-200 shadow-sm">
                    <span>◀ กลับหน้าแดชบอร์ด</span>
                </button>
                <h1 class="text-base sm:text-lg font-extrabold text-royal-900 font-serif pt-1">🏡 จัดการ Estate (ที่อยู่อาศัย)</h1>
            </div>
            <span class="bg-royal-900 text-white text-[9px] font-bold px-2.5 py-1 rounded-full shadow-sm">ADMIN</span>
        </div>

        <!-- ฟอร์มสร้างโครงการที่อยู่อาศัย -->
        <div class="royal-card p-4 sm:p-5 rounded-3xl space-y-3.5 shadow-sm">
            <h2 class="text-xs sm:text-sm font-bold text-royal-900 font-serif">➕ สร้างโครงการที่อยู่อาศัยใหม่</h2>
            <div class="space-y-3">
                
                <div>
                    <label class="text-[11px] font-bold text-royal-900">ประเภทที่อยู่อาศัย</label>
                    <div class="grid grid-cols-3 gap-2 mt-1">
                        <button type="button" id="category-house-btn" onclick="selectCategory('house')" class="py-2.5 px-2 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1">
                            <span>🏠 บ้าน</span>
                        </button>
                        <button type="button" id="category-condo-btn" onclick="selectCategory('condo')" class="py-2.5 px-2 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1">
                            <span>🏢 คอนโด</span>
                        </button>
                        <button type="button" id="category-apartment-btn" onclick="selectCategory('apartment')" class="py-2.5 px-2 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1">
                            <span>🏨 อพาร์ตเมนต์</span>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-2">
                        <label id="name-label" class="text-[11px] font-bold text-royal-900">ชื่อโครงการบ้านจัดสรร</label>
                        <input type="text" id="estate-name" placeholder="เช่น โครงการบ้านเดี่ยว The Botanica" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">อักษรนำรหัส (สูงสุด 3 ตัว)</label>
                        <input type="text" id="estate-prefix" placeholder="เช่น BOT" maxlength="3" value="H" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs uppercase text-center font-bold tracking-wider bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                </div>

                <div id="image-upload-box">
                    <label class="text-[11px] font-bold text-royal-900">รูปภาพโครงการ (ขนาด 1:1)</label>
                    <div class="flex items-center space-x-3 mt-1">
                        <label class="cursor-pointer bg-royal-50 hover:bg-royal-100 text-royal-900 border border-royal-200 font-bold text-xs px-4 py-2.5 rounded-2xl transition shadow-sm inline-flex items-center space-x-1">
                            <span>📁 เลือกรูปภาพ</span>
                            <input type="file" id="estate-image-file" accept="image/*" class="hidden" onchange="previewImage(event)">
                        </label>
                        <span id="file-name-display" class="text-[11px] text-gray-400 truncate">ยังไม่ได้เลือกไฟล์</span>
                    </div>
                    <div id="image-preview-container" class="mt-2 hidden">
                        <img id="image-preview" class="w-16 h-16 rounded-2xl object-cover border border-royal-200 shadow-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">ราคาซื้อขาด (Silver)</label>
                        <input type="number" id="estate-price-buy" placeholder="500000" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">ค่าเช่าต่อสัปดาห์ (Silver)</label>
                        <input type="number" id="estate-price-rent" placeholder="15000" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[11px] font-bold text-royal-900">ค่าน้ำ-ไฟ (ต่อสัปดาห์)</label>
                        <input type="number" id="estate-utilities" placeholder="2500" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                    <div>
                        <label id="count-label" class="text-[11px] font-bold text-royal-900">จำนวนหลังที่ต้องการสร้าง (สูงสุด 15)</label>
                        <input type="number" id="estate-count" placeholder="5" min="1" max="15" value="5" class="w-full px-4 py-2.5 rounded-2xl border border-royal-200 text-xs bg-white focus:outline-none focus:border-royal-700 shadow-inner">
                    </div>
                </div>

                <button onclick="createEstateProject()" id="submit-btn" class="w-full bg-royal-900 hover:bg-royal-800 text-white font-bold text-xs py-3 rounded-2xl transition shadow-md">
                    สร้างโครงการที่อยู่อาศัย (Create Estate)
                </button>
            </div>
        </div>

        <!-- รายการที่อยู่อาศัยทั้งหมดในระบบ -->
        <div class="royal-card p-4 sm:p-5 rounded-3xl space-y-3 shadow-sm">
            <h2 class="text-xs sm:text-sm font-bold text-royal-900 font-serif">📋 รายชื่อที่อยู่อาศัยในระบบปัจจุบัน</h2>
            <div id="estates-catalog-container" class="space-y-3">
                <p class="text-center text-xs text-silver-500 py-6">กำลังโหลดข้อมูลที่อยู่อาศัย...</p>
            </div>
        </div>

    </div>

    <!-- Modal แจ้งเตือน -->
    <div id="custom-modal" class="fixed inset-0 bg-royal-950/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl border-2 border-royal-200 max-w-sm w-full p-6 text-center transform transition-all scale-95 opacity-0 duration-200" id="modal-box">
            <div id="modal-icon" class="w-16 h-16 bg-royal-100 text-royal-900 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner border border-royal-200">⚜️</div>
            <h3 id="modal-title" class="text-lg font-bold text-royal-900 mb-2 font-serif">แจ้งเตือนระบบ</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-6">ข้อความแจ้งเตือน...</p>
            <button onclick="closeModal()" class="bg-royal-900 text-white px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-royal-800 transition w-full shadow-md">ตกลง</button>
        </div>
    </div>

    <script>
        let selectedCategory = 'house';
        let selectedFile = null;

        function showModal(title, message, icon = '⚜️', cb = null) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            modal.classList.remove('hidden');
            setTimeout(() => { box.classList.remove('scale-95', 'opacity-0'); box.classList.add('scale-100', 'opacity-100'); }, 10);
            window.modalCallback = cb;
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100'); box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); if(window.modalCallback) window.modalCallback(); }, 200);
        }

        function selectCategory(category) {
            selectedCategory = category;
            const houseBtn = document.getElementById('category-house-btn');
            const condoBtn = document.getElementById('category-condo-btn');
            const aptBtn = document.getElementById('category-apartment-btn');
            const nameLabel = document.getElementById('name-label');
            const prefixInput = document.getElementById('estate-prefix');
            const countInput = document.getElementById('estate-count');
            const countLabel = document.getElementById('count-label');

            houseBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1";
            condoBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1";
            aptBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-medium bg-royal-50 text-royal-900 border border-royal-200 hover:bg-royal-100 transition flex items-center justify-center space-x-1";

            if (category === 'house') {
                houseBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1";
                nameLabel.innerText = "ชื่อโครงการบ้านจัดสรร";
                prefixInput.value = "H";
                countInput.max = 15;
                countInput.value = 5;
                countLabel.innerText = "จำนวนหลังที่ต้องการสร้าง (สูงสุด 15)";
            } else if (category === 'condo') {
                condoBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1";
                nameLabel.innerText = "ชื่อโครงการคอนโดมิเนียม";
                prefixInput.value = "C";
                countInput.max = 30;
                countInput.value = 10;
                countLabel.innerText = "จำนวนห้องที่ต้องการสร้าง (สูงสุด 30)";
            } else {
                aptBtn.className = "py-2.5 px-2 rounded-2xl text-xs font-bold bg-royal-900 text-white shadow-sm transition flex items-center justify-center space-x-1";
                nameLabel.innerText = "ชื่อตึกอพาร์ตเมนต์";
                prefixInput.value = "A";
                countInput.max = 50;
                countInput.value = 20;
                countLabel.innerText = "จำนวนห้องที่ต้องการสร้าง (สูงสุด 50)";
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                document.getElementById('file-name-display').innerText = file.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('image-preview');
                    preview.src = e.target.result;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') { 
                showModal("Access Denied", "คุณไม่มีสิทธิ์เข้าถึงหน้าผู้ดูแลระบบนี้", "🚫", () => {
                    window.location.href = 'home.html';
                });
                return;
            }

            await loadPropertiesCatalog();
        });

        async function loadPropertiesCatalog() {
            const { data: properties, error } = await supabase.from('properties').select('*').order('id', { ascending: false });
            const container = document.getElementById('estates-catalog-container');
            container.innerHTML = '';

            if (error || !properties || properties.length === 0) {
                container.innerHTML = '<p class="text-center text-xs text-silver-500 py-6">ยังไม่มีข้อมูลที่อยู่อาศัยในระบบ</p>';
                return;
            }

            properties.forEach(p => {
                let badgeColor = p.category === 'house' ? 'bg-royal-50 text-royal-900 border border-royal-200' : p.category === 'condo' ? 'bg-royal-100 text-royal-800 border border-royal-200' : 'bg-royal-200 text-royal-900 border border-royal-300';
                let categoryName = p.category === 'house' ? 'บ้าน' : p.category === 'condo' ? 'คอนโด' : 'อพาร์ตเมนต์';

                container.innerHTML += `
                    <div class="royal-card p-3.5 rounded-3xl shadow-sm flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <img src="${p.image_url || 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=150'}" class="w-12 h-12 rounded-2xl object-cover border border-royal-200 shadow-xs">
                            <div class="space-y-0.5">
                                <span class="text-[9px] font-bold px-2 py-0.5 rounded-full shadow-sm ${badgeColor}">${categoryName}</span>
                                <h4 class="font-bold text-xs text-royal-900 font-serif mt-1">${p.name} (รหัสห้อง: <span class="text-royal-600">${p.room_code}</span>)</h4>
                                <p class="text-[10px] text-silver-500">ซื้อ: <span class="font-semibold text-royal-900">${parseFloat(p.price_buy).toLocaleString()} Silver</span> | เช่า: <span class="font-semibold text-royal-900">${parseFloat(p.price_rent).toLocaleString()} Silver/สัปดาห์</span></p>
                            </div>
                        </div>
                        <button onclick="deleteProperty('${p.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold text-xs px-3 py-1.5 rounded-xl transition shadow-xs border border-red-200 shrink-0">ลบ</button>
                    </div>
                `;
            });
        }

        async function createEstateProject() {
            const name = document.getElementById('estate-name').value.trim();
            const prefix = document.getElementById('estate-prefix').value.trim().toUpperCase();
            const priceBuy = parseFloat(document.getElementById('estate-price-buy').value);
            const priceRent = parseFloat(document.getElementById('estate-price-rent').value);
            const utilitiesCost = parseFloat(document.getElementById('estate-utilities').value);
            const count = parseInt(document.getElementById('estate-count').value);

            let maxLimit = selectedCategory === 'house' ? 15 : selectedCategory === 'condo' ? 30 : 50;

            if (!name || !prefix || isNaN(priceBuy) || isNaN(priceRent) || isNaN(utilitiesCost) || isNaN(count)) {
                showModal("กรอกข้อมูลไม่ครบ", "กรุณากรอกชื่อโครงการ อักษรนำรหัส ราคา และจำนวนยูนิตให้ครบถ้วน", "⚠️");
                return;
            }

            if (prefix.length > 3) {
                showModal("อักษรนำรหัสไม่ถูกต้อง", "อักษรนำหน้ารหัสต้องไม่เกิน 3 ตัวอักษร", "⚠️");
                return;
            }

            if (count < 1 || count > maxLimit) {
                showModal("จำนวนไม่ถูกต้อง", `ประเภท ${selectedCategory.toUpperCase()} สามารถสร้างได้สูงสุด ${maxLimit} ยูนิตต่อครั้ง`, "⚠️");
                return;
            }

            let imageUrl = 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=300';
            const submitBtn = document.getElementById('submit-btn');

            if (selectedFile) {
                try {
                    submitBtn.innerText = 'กำลังอัปโหลดรูปภาพ...';
                    submitBtn.disabled = true;
                    imageUrl = await uploadToCloudinary(selectedFile);
                    if (!imageUrl) {
                        submitBtn.innerText = 'สร้างโครงการที่อยู่อาศัย (Create Estate)';
                        submitBtn.disabled = false;
                        return;
                    }
                } catch (err) {
                    showModal("อัปโหลดรูปภาพไม่สำเร็จ", "เกิดข้อผิดพลาดในการอัปโหลดรูปไปยัง Cloudinary", "❌");
                    submitBtn.innerText = 'สร้างโครงการที่อยู่อาศัย (Create Estate)';
                    submitBtn.disabled = false;
                    return;
                }
            }

            let insertBatch = [];
            for (let i = 1; i <= count; i++) {
                let roomCode = `${prefix}-${String(i).padStart(2, '0')}`;
                
                insertBatch.push({
                    category: selectedCategory,
                    name: name,
                    room_code: roomCode,
                    image_url: imageUrl,
                    price_buy: priceBuy,
                    price_rent: priceRent,
                    utilities_cost: utilitiesCost,
                    max_residents: selectedCategory === 'house' ? 4 : 2,
                    ownership_type: 'none'
                });
            }

            const { error } = await supabase.from('properties').insert(insertBatch);

            submitBtn.innerText = 'สร้างโครงการที่อยู่อาศัย (Create Estate)';
            submitBtn.disabled = false;

            if (error) {
                showModal("เกิดข้อผิดพลาด", error.message, "❌");
                return;
            }

            showModal("สร้างโครงการสำเร็จ! 🎉", `เพิ่มที่อยู่อาศัย ${count} ยูนิต (รหัสขึ้นต้นด้วย ${prefix}-) เข้าสู่ระบบเรียบร้อยแล้ว`, "🏡", () => {
                document.getElementById('estate-name').value = '';
                document.getElementById('estate-price-buy').value = '';
                document.getElementById('estate-price-rent').value = '';
                document.getElementById('estate-utilities').value = '';
                document.getElementById('estate-image-file').value = '';
                document.getElementById('file-name-display').innerText = 'ยังไม่ได้เลือกไฟล์';
                document.getElementById('image-preview-container').classList.add('hidden');
                selectedFile = null;
                loadPropertiesCatalog();
            });
        }

        async function deleteProperty(id) {
            const { error } = await supabase.from('properties').delete().eq('id', id);
            if (error) { 
                showModal("เกิดข้อผิดพลาด", error.message, "❌"); 
                return; 
            }
            showModal("ลบที่อยู่อาศัยสำเร็จ", "ลบข้อมูลที่อยู่อาศัยออกจากระบบแล้ว", "🗑️", () => loadPropertiesCatalog());
        }
    </script>
</body>
</html>
